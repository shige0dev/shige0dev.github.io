        document.getElementById('close-preset-modal-btn').addEventListener('click', () => presetModal.classList.add('hidden'));

        const promptModal = document.getElementById('custom-prompt-modal');
        const promptDialogBox = document.getElementById('prompt-dialog-box');
        const promptInput = document.getElementById('prompt-input');
        const promptTitle = document.getElementById('prompt-title');
        let promptResolve = null;

        function positionPromptDialog(targetItem) {
            const frame = document.getElementById('phone-frame');
            if (!promptDialogBox || !frame) return;

            promptDialogBox.style.transform = 'none';
            promptModal.classList.remove('hidden');

            const frameRect = frame.getBoundingClientRect();
            const dRect = promptDialogBox.getBoundingClientRect();

            let top, left;
            if (targetItem) {
                const itemRect = targetItem.getBoundingClientRect();
                left = (itemRect.left - frameRect.left) + (itemRect.width - dRect.width) / 2;
                const candidateTop = (itemRect.top - frameRect.top) - dRect.height - 4;
                top = candidateTop >= 40 ? candidateTop : (itemRect.top - frameRect.top) - 4;
            } else {
                left = (frameRect.width - dRect.width) / 2;
                top = (frameRect.height - dRect.height) / 2;
            }

            const pad = 10;
            left = Math.max(pad, Math.min(left, frameRect.width - dRect.width - pad));
            top = Math.max(pad, Math.min(top, frameRect.height - dRect.height - pad));

            promptDialogBox.style.left = `${left}px`;
            promptDialogBox.style.top = `${top}px`;
        }

        function openCustomPrompt(title, initialValue, targetItem = null) {
            promptTitle.querySelector('span').textContent = title;
            promptInput.value = initialValue;
            positionPromptDialog(targetItem);
            setTimeout(() => { promptInput.focus(); promptInput.select(); }, 50);
            return new Promise((resolve) => {
                promptResolve = resolve;
            });
        }

        document.getElementById('prompt-cancel-btn').addEventListener('click', () => {
            promptModal.classList.add('hidden');
            if (promptResolve) promptResolve(null);
        });
        document.getElementById('prompt-backdrop').addEventListener('click', () => {
            promptModal.classList.add('hidden');
            if (promptResolve) promptResolve(null);
        });
        document.getElementById('prompt-ok-btn').addEventListener('click', () => {
            const val = promptInput.value.trim();
            promptModal.classList.add('hidden');
            if (promptResolve) promptResolve(val);
        });
        promptInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('prompt-ok-btn').click();
            } else if (e.key === 'Escape') {
                document.getElementById('prompt-cancel-btn').click();
            }
        });

        function highlightSeparator(sepIdx) {
            document.querySelectorAll('.preset-separator').forEach((sep, idx) => {
                if (idx === sepIdx) sep.classList.add('sep-highlight');
                else sep.classList.remove('sep-highlight');
            });
        }

        function clearSeparatorHighlight() {
            document.querySelectorAll('.preset-separator').forEach(sep => {
                sep.classList.remove('sep-highlight');
            });
        }

        function createSeparator(sepIndex) {
            const sep = document.createElement('div');
            sep.className = 'preset-separator h-[1px] bg-slate-700/60 mx-1 my-[1px] transition-all duration-100 pointer-events-none';
            sep.dataset.sepIndex = sepIndex;
            return sep;
        }

        let currentDraggedKey = null;
        let currentHoverSepIdx = null;
        let lastPresetTapTime = 0;
        let lastPresetTapKey = null;

        function getClosestSeparatorIndex(containerEl, clientY) {
            const items = containerEl.querySelectorAll('.preset-item');
            if (items.length === 0) return 0;
            const firstRect = items[0].getBoundingClientRect();
            if (clientY < firstRect.top + firstRect.height / 2) return 0;
            const lastRect = items[items.length - 1].getBoundingClientRect();
            if (clientY >= lastRect.top + lastRect.height / 2) return items.length;
            for (let i = 0; i < items.length; i++) {
                const rect = items[i].getBoundingClientRect();
                if (clientY < rect.top + rect.height / 2) return i;
            }
            return items.length;
        }

        function renderPresetList() {
            const container = document.getElementById('preset-list-container');
            container.innerHTML = '';
            container.appendChild(createSeparator(0));

            presetOrder.forEach((key, index) => {
                const isActive = (key === currentPresetKey);
                const isSelected = (key === activeSelectedKey);
                const item = document.createElement('div');
                item.className = `preset-item flex items-center justify-between py-1 px-3 rounded-lg border transition cursor-grab active:cursor-grabbing select-none ${isSelected ? 'bg-cyan-950/60 border-cyan-500 text-cyan-200 font-bold shadow-sm' : 'bg-slate-800/60 border-slate-700/60 text-slate-300 hover:bg-slate-800'}`;
                item.draggable = true;
                item.dataset.key = key;
                item.dataset.index = index;
                
                item.innerHTML = `
                    <div class="flex items-center gap-2 flex-1 min-w-0 pr-1 pointer-events-none">
                        <i data-lucide="${isActive ? 'check-circle-2' : 'disc'}" class="w-3.5 h-3.5 ${isActive ? 'text-cyan-400 drop-shadow-[0_0_4px_rgba(34,211,238,0.5)]' : 'text-slate-500'} shrink-0"></i>
                        <span class="truncate text-xs ${isActive ? 'text-cyan-200 font-semibold' : 'text-slate-300'}">${key}</span>
                    </div>
                    <div class="flex items-center shrink-0 pointer-events-none">
                        <i data-lucide="grip-vertical" class="w-4 h-4 text-slate-500"></i>
                    </div>
                `;

                item.addEventListener('dragstart', (e) => {
                    currentDraggedKey = key;
                    e.dataTransfer.setData('text/plain', key);
                    e.dataTransfer.effectAllowed = 'move';
                    item.classList.add('opacity-30');
                });

                item.addEventListener('dragend', () => {
                    item.classList.remove('opacity-30');
                    currentDraggedKey = null;
                    currentHoverSepIdx = null;
                    clearSeparatorHighlight();
                });

                item.addEventListener('click', () => {
                    const now = Date.now();
                    const isDoubleTap = (now - lastPresetTapTime < 350) && (lastPresetTapKey === key);

                    activeSelectedKey = key;
                    if (isDoubleTap) {
                        lastPresetTapTime = 0;
                        lastPresetTapKey = null;
                        loadPreset(key);
                        presetModal.classList.add('hidden');
                        return;
                    }
                    lastPresetTapTime = now;
                    lastPresetTapKey = key;
                    renderPresetList();
                });

                container.appendChild(item);
                container.appendChild(createSeparator(index + 1));
            });

            container.addEventListener('dragover', (e) => {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                const sepIdx = getClosestSeparatorIndex(container, e.clientY);
                currentHoverSepIdx = sepIdx;
                highlightSeparator(sepIdx);
            });

            container.addEventListener('drop', (e) => {
                e.preventDefault();
                clearSeparatorHighlight();
                const draggedKey = e.dataTransfer.getData('text/plain') || currentDraggedKey;

                if (draggedKey && currentHoverSepIdx !== null) {
                    saveFileStateForUndo();
                    const fromIdx = presetOrder.indexOf(draggedKey);
                    let targetSepIdx = currentHoverSepIdx;

                    if (fromIdx !== -1) {
                        presetOrder.splice(fromIdx, 1);
                        if (fromIdx < targetSepIdx) targetSepIdx--;
                        presetOrder.splice(targetSepIdx, 0, draggedKey);
                        savePresetsDB();
                        renderPresetList();
                        showToast('順序を並び替えました');
                    }
                }
                currentDraggedKey = null;
                currentHoverSepIdx = null;
            });

            container.addEventListener('dragleave', (e) => {
                if (!container.contains(e.relatedTarget)) {
                    clearSeparatorHighlight();
                    currentHoverSepIdx = null;
                }
            });

            lucide.createIcons({ root: container });
            updatePresetActionButtonsState();
        }

        document.getElementById('preset-rename-top-btn').addEventListener('click', async () => {
            if (!activeSelectedKey || !presets[activeSelectedKey]) return showToast('プリセットを選択してください');
            const oldKey = activeSelectedKey;
            const targetItem = document.querySelector(`.preset-item[data-key="${oldKey}"]`);
            const newKey = await openCustomPrompt('プリセット名の変更', oldKey, targetItem);
            
            if (newKey && newKey !== oldKey) {
                if (presets[newKey]) return showToast('同名のプリセットが既に存在します');
                saveFileStateForUndo();
                presets[newKey] = presets[oldKey];
                delete presets[oldKey];
                
                const idx = presetOrder.indexOf(oldKey);
                if (idx !== -1) presetOrder[idx] = newKey;

                if (currentPresetKey === oldKey) {
                    currentPresetKey = newKey;
                    document.getElementById('current-preset-name').textContent = newKey;
                }
                activeSelectedKey = newKey;
                savePresetsDB();
                renderPresetList();
                showToast(`名称を "${newKey}" に変更しました`);
            }
        });

        document.getElementById('preset-dup-top-btn').addEventListener('click', () => {
            saveActivePresetAuto();
            if (!activeSelectedKey || !presets[activeSelectedKey]) return showToast('プリセットを選択してください');
            const targetKey = activeSelectedKey;
            const newKey = getAvailableUniqueKey(targetKey);

            saveFileStateForUndo();
            presets[newKey] = JSON.parse(JSON.stringify(presets[targetKey]));
            
            const srcIdx = presetOrder.indexOf(targetKey);
            if (srcIdx !== -1) presetOrder.splice(srcIdx + 1, 0, newKey);
            else presetOrder.push(newKey);

            savePresetsDB();
            renderPresetList();
            showToast(`"${newKey}" として複製しました`);
        });

        document.getElementById('preset-del-top-btn').addEventListener('click', () => {
            if (!activeSelectedKey || !presets[activeSelectedKey]) return showToast('プリセットを選択してください');
            const targetKey = activeSelectedKey;
            saveFileStateForUndo();
            delete presets[targetKey];
            presetOrder = presetOrder.filter(k => k !== targetKey);

            if (presetOrder.length === 0) {
                currentPresetKey = 'Default';
                activeSelectedKey = 'Default';
                presets['Default'] = {
                    gridState: JSON.parse(JSON.stringify(DEFAULT_GRID_STATE)),
                    connections: JSON.parse(JSON.stringify(DEFAULT_CONNECTIONS))
                };
                presetOrder = ['Default'];
                loadPreset('Default');
            } else if (currentPresetKey === targetKey) {
                currentPresetKey = presetOrder[0];
                loadPreset(currentPresetKey);
            } else {
                activeSelectedKey = presetOrder[0];
            }

            savePresetsDB();
            renderPresetList();
            showToast('プリセットを削除しました');
        });

        document.getElementById('preset-new-bottom-btn').addEventListener('click', () => {
            saveActivePresetAuto();
            const now = new Date();
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const datePrefix = `${yyyy}${mm}${dd}`;

            const newKey = getAvailableUniqueKey(datePrefix);
            saveFileStateForUndo();
            presets[newKey] = {
                gridState: Array(COLS * ROWS).fill(null),
                connections: []
            };
            presetOrder.push(newKey);
            activeSelectedKey = newKey;
            savePresetsDB();
            renderPresetList();
            showToast(`新規プリセット "${newKey}" を作成しました`);
        });

        function loadPreset(key) {
            if (presets[key]) {
                currentPresetKey = key;
                activeSelectedKey = key;
                document.getElementById('current-preset-name').textContent = key;
                gridState = JSON.parse(JSON.stringify(presets[key].gridState));
                connections = JSON.parse(JSON.stringify(presets[key].connections));
                selectedModules = [];
                closeSharedModal();
                rebuildAudioFromState(gridState, connections);
                updateAllCells();
                setTimeout(renderCables, 50);
                savePresetsDB();
                showToast(`"${key}" を開きました`);
            }
        }

        function uiUpdateLoop() {
            if (audioWorkletReady || audioCtx) {
                Object.entries(moduleInstances).forEach(([idx, instance]) => {
                    if (instance.type === 'SEQ') {
                        const curStep = instance.currentStep;
                        const isModalOpenForThis = (activePopupIndex === parseInt(idx) && !modal.classList.contains('hidden'));
                        const isPlaying = (seqTransportState === 'playing');

                        for (let s = 0; s < 8; s++) {
                            const led = document.getElementById(`seq-step-led-${idx}-${s}`);
                            if (led) {
                                if (s === curStep && isPlaying) {
                                    led.className = "w-1.5 h-1.5 rounded-full bg-amber-400 shadow-[0_0_6px_#fbbf24] scale-125 transition-all";
                                } else {
                                    led.className = "w-1.5 h-1.5 rounded-full bg-slate-800 transition-all";
                                }
                            }

                            if (isModalOpenForThis) {
                                const mled = document.getElementById(`seq-modal-led-${s}`);
                                if (mled) {
                                    if (s === curStep && isPlaying) {
                                        mled.className = "w-2 h-2 rounded-full bg-amber-400 shadow-[0_0_8px_#fbbf24] scale-125 transition-all";
                                    } else {
                                        mled.className = "w-2 h-2 rounded-full bg-slate-800 border border-slate-700 transition-all";
                                    }
                                }
                            }
                        }
                    } else if (instance.type === 'MON') {
                        const ch = instance.channels || 1;
                        for (let c = 1; c <= ch; c++) {
                            const val = instance.getCurrentValue(c - 1);
                            const strVal = val >= 0 ? '+' + val.toFixed(2) : val.toFixed(2);
                            const disp = document.getElementById(`mon-disp-${idx}-${c}`);
                            if (disp && disp.textContent !== strVal) disp.textContent = strVal;
                            if (activePopupIndex === parseInt(idx)) {
                                const mDisp = document.getElementById(`modal-mon-val-${c}`);
                                if (mDisp && mDisp.textContent !== strVal) mDisp.textContent = strVal;
                            }
                        }
                    } else if (instance.type === 'MATH') {
                        const val = instance.getCurrentValue(0);
                        const strVal = val >= 0 ? '+' + val.toFixed(2) : val.toFixed(2);
                        const gridDisp = document.getElementById(`math-disp-${idx}`);
                        if (gridDisp && gridDisp.textContent !== strVal) {
                            gridDisp.textContent = strVal;
                        }
                    } else if (instance.type === 'SCOPE') {
                        const canvas = document.getElementById(`scope-canvas-${idx}`);
                        if (canvas && instance.analyser) {
                            const ctx2d = canvas.getContext('2d');
                            const w = canvas.width;
                            const h = canvas.height;
                            
                            const bufferLength = instance.analyser.frequencyBinCount;
                            const rawData = new Float32Array(bufferLength);
                            instance.analyser.getFloatTimeDomainData(rawData);

                            if (!instance.historyBuffer || instance.historyLength !== 2000) {
                                instance.historyLength = 2000;
                                instance.historyBuffer = new Float32Array(2000);
                                instance.historyWriteIdx = 0;
                                instance.lastAudioTime = audioCtx ? audioCtx.currentTime : 0;
                            }

                            const curAudioTime = audioCtx ? audioCtx.currentTime : 0;
                            if (instance.lastAudioTime === 0) {
                                instance.lastAudioTime = curAudioTime;
                            }

                            let dt = curAudioTime - instance.lastAudioTime;
                            if (dt > 0) {
                                if (dt > 0.5) {
                                    instance.lastAudioTime = curAudioTime - 0.05;
                                    dt = 0.05;
                                }
                                const sRate = audioCtx ? audioCtx.sampleRate : 48000;
                                const stride = sRate / 1000;
                                const samplesToAdd = Math.min(100, Math.floor(dt * 1000));
                                for (let s = samplesToAdd - 1; s >= 0; s--) {
                                    const offsetFromEnd = Math.round(s * stride);
                                    const rIdx = (bufferLength - 1) - offsetFromEnd;
                                    const val = (rIdx >= 0 && rIdx < bufferLength) ? rawData[rIdx] : rawData[bufferLength - 1];
                                    instance.historyBuffer[instance.historyWriteIdx] = val;
                                    instance.historyWriteIdx = (instance.historyWriteIdx + 1) % instance.historyLength;
                                }
                                if (samplesToAdd > 0) {
                                    instance.lastAudioTime += samplesToAdd / 1000;
                                }
                            }

                            const timeSpan = (instance.data && instance.data.timeSpan !== undefined) ? Number(instance.data.timeSpan) : 0.01;
                            const vRange = (instance.data && instance.data.vRange !== undefined) ? Number(instance.data.vRange) : 5.0;
                            const trigMode = (instance.data && instance.data.trigMode) ? instance.data.trigMode : 'auto';

                            ctx2d.clearRect(0, 0, w, h);

                            ctx2d.strokeStyle = '#1e293b';
                            ctx2d.lineWidth = 0.8;
                            ctx2d.beginPath();
                            ctx2d.moveTo(0, h / 2); ctx2d.lineTo(w, h / 2);
                            ctx2d.moveTo(0, h * 0.15); ctx2d.lineTo(w, h * 0.15);
                            ctx2d.moveTo(0, h * 0.85); ctx2d.lineTo(w, h * 0.85);
                            ctx2d.moveTo(w * 0.25, 0); ctx2d.lineTo(w * 0.25, h);
                            ctx2d.moveTo(w * 0.5, 0);  ctx2d.lineTo(w * 0.5, h);
                            ctx2d.moveTo(w * 0.75, 0); ctx2d.lineTo(w * 0.75, h);
                            ctx2d.stroke();

                            let samplesToRender;
                            const isLongScale = timeSpan > 0.05;

                            if (isLongScale) {
                                const pts = Math.min(instance.historyLength, Math.max(3, Math.round(timeSpan * 1000)));
                                samplesToRender = new Float32Array(pts);
                                const start = (instance.historyWriteIdx - pts + instance.historyLength) % instance.historyLength;
                                for (let p = 0; p < pts; p++) {
                                    samplesToRender[p] = instance.historyBuffer[(start + p) % instance.historyLength];
                                }
                            } else {
                                const sRate = audioCtx ? audioCtx.sampleRate : 48000;
                                const pts = Math.max(3, Math.min(bufferLength, Math.round(timeSpan * sRate)));
                                let startIdx = 0;

                                const isTrigPatched = isPortPatched(parseInt(idx), 'trig');
                                let trigData = rawData;
                                if (isTrigPatched && instance.trigAnalyser) {
                                    const trigBuf = new Float32Array(instance.trigAnalyser.frequencyBinCount);
                                    instance.trigAnalyser.getFloatTimeDomainData(trigBuf);
                                    trigData = trigBuf;
                                }

                                if (trigMode === 'auto') {
                                    const maxSearch = Math.min(trigData.length - pts - 1, bufferLength - pts - 1);
                                    for (let i = 0; i < maxSearch; i++) {
                                        if (trigData[i] <= 0 && trigData[i + 1] > 0) {
                                            startIdx = i;
                                            break;
                                        }
                                    }
                                }
                                samplesToRender = rawData.subarray(startIdx, startIdx + pts);
                            }

                            const len = samplesToRender.length;
                            if (len > 1) {
                                ctx2d.lineWidth = 1.4;
                                ctx2d.strokeStyle = '#22d3ee';
                                ctx2d.beginPath();
                                const sliceW = w / (len - 1);

                                for (let i = 0; i < len; i++) {
                                    const volt = samplesToRender[i];
                                    const normalized = volt / vRange; 
                                    let y = (h / 2) - (normalized * (h * 0.38));
                                    y = Math.max(1, Math.min(h - 1, y));
                                    const x = i * sliceW;
                                    if (i === 0) ctx2d.moveTo(x, y);
                                    else ctx2d.lineTo(x, y);
                                }
                                ctx2d.stroke();
                            }

                            ctx2d.font = '7px monospace';
                            ctx2d.textBaseline = 'top';

                            ctx2d.fillStyle = '#f59e0b';
                            ctx2d.fillText(`+${vRange.toFixed(1)}V`, 2, 1);
                            ctx2d.fillStyle = '#64748b';
                            ctx2d.fillText(' 0V', 2, (h / 2) - 3.5);
                            ctx2d.fillStyle = '#f59e0b';
                            ctx2d.textBaseline = 'bottom';
                            ctx2d.fillText(`-${vRange.toFixed(1)}V`, 2, h - 1);

                            ctx2d.fillStyle = '#38bdf8';
                            ctx2d.textAlign = 'right';
                            const timeStr = timeSpan < 0.001 
                                ? `${Math.round(timeSpan * 1000000)}μs` 
                                : (timeSpan < 1.0 ? `${Math.round(timeSpan * 1000)}ms` : `${timeSpan.toFixed(1)}s`);
                            ctx2d.fillText(timeStr, w - 2, h - 1);
                            
                            const isTrigConnected = isPortPatched(parseInt(idx), 'trig');
                            if (trigMode === 'free') {
                                ctx2d.fillStyle = '#f59e0b';
                                ctx2d.fillText('FREE', w - 2, 1);
                            } else if (isTrigConnected) {
                                ctx2d.fillStyle = '#ec4899';
                                ctx2d.fillText('EXT TRIG', w - 2, 1);
                            } else {
                                ctx2d.fillStyle = '#22d3ee';
                                ctx2d.fillText('AUTO', w - 2, 1);
                            }
                            ctx2d.textAlign = 'left';
                        }
                    }
                });
            }
            requestAnimationFrame(uiUpdateLoop);
        }

        const resizeObserver = new ResizeObserver(entries => {
            for (let entry of entries) {
                const isLandscape = entry.contentRect.width > entry.contentRect.height;
                gridBoard.className = isLandscape 
                    ? "grid grid-cols-8 gap-1.5 w-full relative z-20 mt-2" 
                    : "grid grid-cols-5 gap-1.5 w-full relative z-20 mt-2";
                setTimeout(renderCables, 50);
            }
        });
        resizeObserver.observe(document.getElementById('phone-frame'));

        initGrid();
        rebuildAudioFromState(gridState, connections);
        window.addEventListener('resize', renderCables);
        updateTransportButtonsUI();
        lucide.createIcons();
        requestAnimationFrame(uiUpdateLoop);
    </script>
</body>
</html>
