<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GRIDSYNTH MOBILE</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            user-select: none;
            background-color: #030712;
            color: #f8fafc;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            touch-action: manipulation;
            overflow: hidden;
            -webkit-text-size-adjust: none;
            text-size-adjust: none;
            -webkit-tap-highlight-color: transparent;
        }
        .bg-grid {
            background-size: 20px 20px;
            background-image: radial-gradient(circle, rgba(255,255,255,0.06) 1px, transparent 1px);
        }
        #cable-canvas {
            pointer-events: none;
            z-index: 10;
            opacity: 0.85;
        }
        #cable-canvas path {
            transition: stroke 0.2s;
        }
        .drop-highlight-valid {
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.7) !important;
            background-color: rgba(255, 255, 255, 0.2) !important;
            border-color: white !important;
            z-index: 40;
        }
        .drop-highlight-copy-valid {
            box-shadow: 0 0 15px rgba(234, 179, 8, 0.7) !important;
            background-color: rgba(234, 179, 8, 0.2) !important;
            border-color: #eab308 !important;
            z-index: 40;
        }
        .drop-highlight-invalid {
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.7) !important;
            background-color: rgba(239, 68, 68, 0.2) !important;
            border-color: #ef4444 !important;
            z-index: 40;
        }
        .selected-module {
            box-shadow: 0 0 15px rgba(217, 70, 239, 0.5) !important;
            border-color: #d946ef !important;
            border-width: 2px !important;
        }
        .sep-highlight {
            background-color: #ffffff !important;
            height: 2px !important;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.95) !important;
            border-radius: 9999px;
        }
        .native-vslider {
            writing-mode: vertical-lr;
            direction: rtl;
            appearance: slider-vertical;
            -webkit-appearance: slider-vertical;
            width: 24px;
            height: 96px;
            cursor: pointer;
            padding: 0 2px;
            touch-action: none;
            background: transparent;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center bg-gray-950 p-0 sm:p-2">

    <div id="phone-frame" class="w-full h-full sm:w-[410px] sm:h-[860px] max-w-[440px] max-h-[920px] sm:max-w-none sm:max-h-none flex flex-col bg-slate-900/90 border border-slate-800 sm:rounded-3xl shadow-2xl relative overflow-hidden bg-grid">

        <!-- Header -->
        <header class="h-12 border-b border-slate-800 bg-slate-950/80 px-2 flex items-center justify-between shrink-0 z-20 gap-1 overflow-x-auto">
            <div class="flex items-center gap-1 shrink-0">
                <button id="audio-power-btn" class="p-1.5 bg-emerald-950/80 hover:bg-emerald-900/80 text-emerald-400 rounded-lg border border-emerald-500/60 transition flex items-center justify-center shadow-sm" title="AUDIO RUNNING (Click to Stop/Mute)">
                    <i data-lucide="power" class="w-3.5 h-3.5"></i>
                </button>

                <div class="flex items-center bg-slate-900 border border-slate-700 rounded-lg p-0.5 gap-0.5">
                    <button id="seq-play-btn" class="p-1 rounded text-slate-400 hover:text-white transition flex items-center justify-center" title="PLAY (再生)">
                        <i data-lucide="play" class="w-3.5 h-3.5 text-cyan-400"></i>
                    </button>
                    <button id="seq-pause-btn" class="p-1 rounded text-slate-400 hover:text-white transition flex items-center justify-center" title="PAUSE (一時停止)">
                        <i data-lucide="pause" class="w-3.5 h-3.5 text-amber-400"></i>
                    </button>
                    <button id="seq-stop-btn" class="p-1 rounded bg-rose-950/80 text-rose-300 border border-rose-500/60 shadow-xs flex items-center justify-center" title="STOP (停止・先頭リセット)">
                        <i data-lucide="square" class="w-3.5 h-3.5"></i>
                    </button>
                </div>

                <div class="flex items-center bg-slate-900 border border-slate-700 rounded px-1.5 py-0.5 gap-0.5">
                    <span class="text-[8px] text-slate-400 font-bold uppercase tracking-tighter">BPM</span>
                    <input type="number" id="master-bpm-input" min="40" max="260" value="120" class="w-8 bg-transparent text-rose-400 font-mono font-bold text-[10px] focus:outline-none text-center p-0">
                </div>
            </div>

            <div class="flex items-center gap-1 flex-1 max-w-[125px]">
                <button id="preset-trigger-btn" class="w-full bg-slate-900 hover:bg-slate-800 border border-slate-700 text-slate-200 text-[10px] font-medium rounded px-2 py-1 flex items-center justify-between transition truncate shadow-sm">
                    <span id="current-preset-name" class="truncate">Default</span>
                    <i data-lucide="chevron-down" class="w-3 h-3 text-slate-400 shrink-0 ml-1"></i>
                </button>
            </div>

            <div class="flex items-center gap-1 shrink-0">
                <button id="undo-btn" class="px-2 py-1 bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-700 rounded transition text-[10px] flex items-center gap-1 opacity-40 cursor-not-allowed" title="ひとつ戻る (最大2回)" disabled>
                    <i data-lucide="undo-2" class="w-3 h-3"></i>
                    <span>UNDO</span>
                </button>
            </div>
        </header>

        <!-- Main Workspace -->
        <main id="canvas-container" class="flex-1 relative overflow-hidden p-2 flex flex-col items-center justify-start">
            <svg id="cable-canvas" class="absolute inset-0 w-full h-full z-10 transition-opacity duration-300" shape-rendering="geometricPrecision"></svg>
            <div id="grid-board" class="grid grid-cols-5 gap-1.5 w-full relative z-20 mt-2"></div>
        </main>

        <footer class="h-9 border-t border-slate-800 bg-slate-950/90 px-3 flex items-center justify-between text-[9px] text-slate-400 shrink-0 z-25 whitespace-nowrap overflow-hidden">
            <span>💡 Wタップ:設定 / 長押し:選択 / 選択時タップ:削除 / ドラッグ:移動(0.9sコピー)</span>
        </footer>

        <!-- Preset Manager Modal -->
        <div id="preset-manager-modal" class="absolute inset-0 hidden z-50 flex items-start justify-center pt-2 px-3">
            <div id="close-preset-bg" class="absolute inset-0 bg-black/50 backdrop-blur-[2px] cursor-pointer"></div>
            <div class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-[360px] p-2.5 shadow-2xl relative z-10 flex flex-col max-h-[78vh]">
                <div class="flex items-center gap-1.5 pb-2 border-b border-slate-800">
                    <div class="grid grid-cols-4 gap-1.5 flex-1">
                        <button id="preset-rename-top-btn" class="h-7 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg transition flex items-center justify-center border border-slate-700 hover:border-slate-600" title="名称変更">
                            <i data-lucide="pencil" class="w-3.5 h-3.5 text-cyan-400"></i>
                        </button>
                        <button id="preset-dup-top-btn" class="h-7 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg transition flex items-center justify-center border border-slate-700 hover:border-slate-600" title="複製">
                            <i data-lucide="copy" class="w-3.5 h-3.5 text-amber-400"></i>
                        </button>
                        <button id="preset-del-top-btn" class="h-7 bg-slate-800 hover:bg-slate-700 text-red-400 rounded-lg transition flex items-center justify-center border border-slate-700 hover:bg-red-500/10 hover:border-red-500/30" title="削除">
                            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                        </button>
                        <button id="preset-file-undo-btn" class="h-7 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg transition flex items-center justify-center border border-slate-700 opacity-40 cursor-not-allowed" title="元に戻す (Undo)" disabled>
                            <i data-lucide="undo-2" class="w-3.5 h-3.5 text-cyan-300"></i>
                        </button>
                    </div>
                    <div class="w-[1px] h-5 bg-slate-800 mx-0.5"></div>
                    <button id="close-preset-modal-btn" class="h-7 w-7 flex items-center justify-center text-slate-400 hover:text-white bg-slate-800/60 hover:bg-slate-800 border border-slate-700/60 rounded-lg transition shrink-0" title="閉じる">
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </button>
                </div>
                <div id="preset-list-container" class="flex-1 overflow-y-auto pr-0.5 max-h-[44vh] mt-1"></div>
                <div class="pt-2 border-t border-slate-800 mt-1">
                    <button id="preset-new-bottom-btn" class="w-full py-1 px-3 bg-slate-800 hover:bg-slate-700 border border-dashed border-cyan-500/40 text-cyan-300 rounded-lg text-xs font-bold transition flex items-center justify-center gap-1.5 shadow-sm" style="min-height: 28px;">
                        <i data-lucide="file-plus" class="w-3.5 h-3.5"></i>
                        <span>＋ 新規作成</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Custom Prompt Modal -->
        <div id="custom-prompt-modal" class="absolute inset-0 hidden z-[70]">
            <div id="prompt-backdrop" class="absolute inset-0 bg-black/50 backdrop-blur-[1px] cursor-pointer"></div>
            <div id="prompt-dialog-box" class="absolute bg-slate-900 border border-cyan-500/70 rounded-xl w-[260px] p-2.5 shadow-2xl z-10 space-y-2 transition-none">
                <div class="flex items-center justify-between pb-1 border-b border-slate-800">
                    <h4 id="prompt-title" class="text-[10px] font-bold text-cyan-300 uppercase tracking-wider flex items-center gap-1">
                        <i data-lucide="pencil" class="w-3 h-3 text-cyan-400"></i>
                        <span>プリセット名の変更</span>
                    </h4>
                </div>
                <input type="text" id="prompt-input" class="w-full bg-slate-950 border border-slate-700 rounded px-2.5 py-1 text-xs text-white focus:outline-none focus:border-cyan-500 font-medium">
                <div class="flex justify-end gap-1.5 pt-0.5">
                    <button id="prompt-cancel-btn" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-[11px] font-medium transition">キャンセル</button>
                    <button id="prompt-ok-btn" class="px-3 py-1 bg-cyan-600 hover:bg-cyan-500 text-white rounded text-[11px] font-bold transition shadow-sm">OK</button>
                </div>
            </div>
        </div>

        <!-- Shared Module Settings/Addition Modal -->
        <div id="shared-modal" class="absolute inset-0 hidden z-50">
            <div id="close-modal-bg" class="absolute inset-0 bg-black/20 backdrop-blur-[1px] cursor-pointer"></div>
            <div id="modal-content" class="absolute bg-slate-900/95 border border-slate-700 rounded-xl p-3 shadow-2xl backdrop-blur-md transition-none">
                <div id="modal-header" class="border-b border-slate-800 pb-2 flex justify-between items-center">
                    <h3 id="modal-title" class="text-[10px] font-bold text-cyan-300 uppercase tracking-wider">TITLE</h3>
                </div>
                <div id="modal-body" class="text-xs"></div>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="absolute bottom-14 left-1/2 -translate-x-1/2 px-3 py-1.5 bg-slate-800/95 border border-slate-700 rounded-full text-[11px] text-cyan-200 shadow-xl pointer-events-none opacity-0 transition-opacity duration-200 z-50 whitespace-nowrap">
        通知メッセージ
    </div>

    <script>
        lucide.createIcons();

        let audioCtx = null;
        let masterKeepAliveGain = null;
        let audioWorkletReady = false;
        let seqTransportState = 'stopped';
        let masterBPM = 120;

        function getAudioContext() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContextClass();
                masterKeepAliveGain = audioCtx.createGain();
                masterKeepAliveGain.gain.value = 0.00001;
                masterKeepAliveGain.connect(audioCtx.destination);

                if (audioCtx.audioWorklet) {
                    try {
                        const workletCode = `
                            class ClockProcessor extends AudioWorkletProcessor {
                                static get parameterDescriptors() {
                                    return [
                                        { name: 'bpm', defaultValue: 120.0, minValue: 40.0, maxValue: 260.0, automationRate: 'k-rate' },
                                        { name: 'pulseWidthMs', defaultValue: 15.0, minValue: 2.0, maxValue: 1500.0, automationRate: 'k-rate' }
                                    ];
                                }
                                constructor() {
                                    super();
                                    this.sampleCount = 0;
                                    this.pulseSamplesLeft = 0;
                                    this.div = 'x2';
                                    this.running = false;
                                    this.port.onmessage = (e) => {
                                        if (e.data.type === 'SET_STATE') {
                                            if (typeof e.data.running === 'boolean') {
                                                const wasRunning = this.running;
                                                this.running = e.data.running;
                                                if (this.running && !wasRunning) {
                                                    // Fire first pulse immediately on play start
                                                    this.sampleCount = 999999999;
                                                    this.pulseSamplesLeft = 0;
                                                } else if (!this.running) {
                                                    this.sampleCount = 0;
                                                    this.pulseSamplesLeft = 0;
                                                }
                                            }
                                            if (e.data.div) this.div = e.data.div;
                                        }
                                    };
                                }
                                process(inputs, outputs, parameters) {
                                    const out = outputs[0] ? outputs[0][0] : null;
                                    if (!out) return true;
                                    const len = out.length;
                                    const sRate = (typeof sampleRate !== 'undefined') ? sampleRate : 48000;
                                    const bpm = parameters.bpm[0] || 120.0;
                                    const pulseWidthMs = parameters.pulseWidthMs[0] || 15.0;

                                    let mult = 2.0;
                                    if (typeof this.div === 'string' && this.div.startsWith('x')) {
                                        mult = parseFloat(this.div.slice(1)) || 2.0;
                                    } else if (typeof this.div === 'number') {
                                        mult = this.div;
                                    } else if (this.div === '1/4') mult = 1.0;
                                    else if (this.div === '1/8') mult = 2.0;
                                    else if (this.div === '1/16') mult = 4.0;
                                    else if (this.div === '1/32') mult = 8.0;
                                    else if (this.div === '1/2') mult = 0.5;
                                    else if (this.div === '1/1') mult = 0.25;

                                    const intervalSec = 60.0 / bpm / mult;
                                    const samplesPerInterval = Math.max(1, Math.round(intervalSec * sRate));
                                    const pulseWidthSec = pulseWidthMs / 1000.0;
                                    const isAlwaysOn = pulseWidthSec >= intervalSec;

                                    const minLowSamples = Math.max(1, Math.round(0.002 * sRate));
                                    const maxPulseSamples = Math.max(1, samplesPerInterval - minLowSamples);
                                    const targetPulseSamples = Math.max(1, Math.round(pulseWidthSec * sRate));
                                    const pulseDurationSamples = isAlwaysOn ? samplesPerInterval : Math.min(maxPulseSamples, targetPulseSamples);

                                    for (let i = 0; i < len; i++) {
                                        if (!this.running) {
                                            out[i] = 0.0;
                                            continue;
                                        }

                                        if (this.sampleCount >= samplesPerInterval) {
                                            this.sampleCount = 0;
                                            this.pulseSamplesLeft = pulseDurationSamples;
                                        }
                                        this.sampleCount++;

                                        if (isAlwaysOn || this.pulseSamplesLeft > 0) {
                                            out[i] = 1.0;
                                            if (!isAlwaysOn) {
                                                this.pulseSamplesLeft--;
                                            }
                                        } else {
                                            out[i] = 0.0;
                                        }
                                    }
                                    return true;
                                }
                            }
                            registerProcessor('clock-processor', ClockProcessor);

                            class SeqProcessor extends AudioWorkletProcessor {
                                constructor() {
                                    super();
                                    this.currentStep = -1;
                                    this.lastInputHigh = false;
                                    this.currentCv = 0.0;
                                    this.currentGate = 0.0;
                                    this.retriggerGapSamples = 0;
                                    this.steps = [
                                        { cv: 0.0, active: true, cvActive: true, gate: true },
                                        { cv: 0.167, active: true, cvActive: true, gate: true },
                                        { cv: 0.333, active: true, cvActive: true, gate: true },
                                        { cv: 0.417, active: true, cvActive: true, gate: true },
                                        { cv: 0.583, active: true, cvActive: true, gate: true },
                                        { cv: 0.75, active: true, cvActive: true, gate: true },
                                        { cv: 0.917, active: true, cvActive: true, gate: true },
                                        { cv: 1.0, active: true, cvActive: true, gate: true }
                                    ];
                                    this.port.onmessage = (e) => {
                                        if (e.data.type === 'SET_STEPS') {
                                            if (Array.isArray(e.data.steps)) this.steps = e.data.steps;
                                        } else if (e.data.type === 'RESET') {
                                            this.currentStep = -1;
                                            this.lastInputHigh = false;
                                            this.retriggerGapSamples = 0;
                                        }
                                    };
                                }
                                process(inputs, outputs, parameters) {
                                    const gateIn = (inputs[0] && inputs[0][0]) ? inputs[0][0] : null;
                                    const cvOut = outputs[0] ? outputs[0][0] : null;
                                    const gateOut = outputs[1] ? outputs[1][0] : null;
                                    const len = (cvOut || gateOut || (gateIn ? gateIn : [])).length || 128;
                                    const sRate = (typeof sampleRate !== 'undefined') ? sampleRate : 48000;
                                    const minGapSamples = Math.max(1, Math.round(0.002 * sRate));

                                    for (let i = 0; i < len; i++) {
                                        const gateVal = gateIn ? gateIn[i] : 0.0;
                                        const isHigh = this.lastInputHigh ? (gateVal > 0.15) : (gateVal > 0.45);

                                        if (isHigh && !this.lastInputHigh) {
                                            let nextStep = this.currentStep;
                                            let found = false;
                                            for (let attempts = 0; attempts < 8; attempts++) {
                                                nextStep = (nextStep + 1) % 8;
                                                const st = this.steps[nextStep];
                                                if (st && st.active !== false) {
                                                    found = true;
                                                    break;
                                                }
                                            }

                                            if (found) {
                                                this.currentStep = nextStep;
                                                const step = this.steps[this.currentStep] || { cv: 0, active: true, cvActive: true, gate: true };
                                                
                                                if (step.cvActive !== false) {
                                                    this.currentCv = (step.cv !== undefined ? step.cv : 0.0);
                                                }
                                                this.retriggerGapSamples = minGapSamples;
                                                this.port.postMessage({ type: 'STEP', step: this.currentStep });
                                            }
                                        }
                                        this.lastInputHigh = isHigh;

                                        const curStepObj = this.currentStep >= 0 ? this.steps[this.currentStep] : null;
                                        const stepGateEnabled = curStepObj ? (curStepObj.gate !== false && curStepObj.active !== false) : false;

                                        if (this.retriggerGapSamples > 0) {
                                            this.retriggerGapSamples--;
                                            this.currentGate = 0.0;
                                        } else if (stepGateEnabled && isHigh) {
                                            this.currentGate = 1.0;
                                        } else {
                                            this.currentGate = 0.0;
                                        }

                                        if (cvOut) cvOut[i] = this.currentCv;
                                        if (gateOut) gateOut[i] = this.currentGate;
                                    }
                                    return true;
                                }
                            }
                            registerProcessor('seq-processor', SeqProcessor);

                            class AdsrProcessor extends AudioWorkletProcessor {
                                constructor() {
                                    super();
                                    this.lastInputHigh = false;
                                    this.envVal = 0.0;
                                    this.state = 'idle';
                                    this.attack = 0.02;
                                    this.decay = 0.2;
                                    this.sustain = 0.6;
                                    this.release = 0.4;
                                    this.port.onmessage = (e) => {
                                        if (e.data.type === 'SET_PARAMS') {
                                            if (e.data.attack !== undefined) this.attack = e.data.attack;
                                            if (e.data.decay !== undefined) this.decay = e.data.decay;
                                            if (e.data.sustain !== undefined) this.sustain = e.data.sustain;
                                            if (e.data.release !== undefined) this.release = e.data.release;
                                        }
                                    };
                                }
                                process(inputs, outputs, parameters) {
                                    const gateIn = (inputs[0] && inputs[0][0]) ? inputs[0][0] : null;
                                    const out = outputs[0] ? outputs[0][0] : null;
                                    if (!out) return true;
                                    const len = out.length;
                                    const sRate = (typeof sampleRate !== 'undefined') ? sampleRate : 48000;

                                    const aRate = 1.0 / Math.max(1, this.attack * sRate);
                                    const dRate = 1.0 / Math.max(1, this.decay * sRate);
                                    const rRate = 1.0 / Math.max(1, this.release * sRate);

                                    for (let i = 0; i < len; i++) {
                                        const gVal = gateIn ? gateIn[i] : 0.0;
                                        const isHigh = this.lastInputHigh ? (gVal > 0.15) : (gVal > 0.45);

                                        if (isHigh && !this.lastInputHigh) {
                                            this.state = 'attack';
                                        } else if (!isHigh && this.lastInputHigh) {
                                            this.state = 'release';
                                        }
                                        this.lastInputHigh = isHigh;

                                        if (this.state === 'attack') {
                                            this.envVal += aRate;
                                            if (this.envVal >= 1.0) {
                                                this.envVal = 1.0;
                                                this.state = 'decay';
                                            }
                                        } else if (this.state === 'decay') {
                                            this.envVal -= dRate * (1.0 - this.sustain + 0.001);
                                            if (this.envVal <= this.sustain) {
                                                this.envVal = this.sustain;
                                                this.state = 'sustain';
                                            }
                                        } else if (this.state === 'sustain') {
                                            this.envVal = this.sustain;
                                        } else if (this.state === 'release') {
                                            this.envVal -= rRate;
                                            if (this.envVal <= 0.0) {
                                                this.envVal = 0.0;
                                                this.state = 'idle';
                                            }
                                        } else {
                                            this.envVal = 0.0;
                                        }

                                        out[i] = this.envVal;
                                    }
                                    return true;
                                }
                            }
                            registerProcessor('adsr-processor', AdsrProcessor);

                            class LfoProcessor extends AudioWorkletProcessor {
                                static get parameterDescriptors() {
                                    return [
                                        { name: 'rate', defaultValue: 2.0, minValue: 0.01, maxValue: 100.0, automationRate: 'a-rate' },
                                        { name: 'depth', defaultValue: 1.0, minValue: 0.0, maxValue: 10.0, automationRate: 'k-rate' },
                                        { name: 'duty', defaultValue: 0.5, minValue: 0.01, maxValue: 0.99, automationRate: 'k-rate' }
                                    ];
                                }
                                constructor() {
                                    super();
                                    this.phase = 0.0;
                                    this.type = 'sine';
                                    this.polarity = 'bipolar';
                                    this.port.onmessage = (e) => {
                                        if (e.data.type === 'SET_CONFIG') {
                                            if (e.data.waveType) this.type = e.data.waveType;
                                            if (e.data.polarity) this.polarity = e.data.polarity;
                                        }
                                    };
                                }
                                process(inputs, outputs, parameters) {
                                    const output = outputs[0] ? outputs[0][0] : null;
                                    if (!output) return true;
                                    const len = output.length;
                                    const rateParam = parameters.rate;
                                    const isRateA = rateParam.length > 1;
                                    const depth = parameters.depth[0];
                                    const duty = Math.max(0.01, Math.min(0.99, parameters.duty[0]));
                                    const isUnipolar = (this.polarity === 'unipolar');
                                    const type = this.type;
                                    const sRate = (typeof sampleRate !== 'undefined') ? sampleRate : 48000;

                                    for (let i = 0; i < len; i++) {
                                        const curRate = isRateA ? rateParam[i] : rateParam[0];
                                        this.phase += Math.max(0.001, curRate) / sRate;
                                        if (this.phase >= 1.0) this.phase -= 1.0;
                                        const p = this.phase;
                                        let raw = 0.0;

                                        if (type === 'sine') raw = Math.sin(2 * Math.PI * p);
                                        else if (type === 'square') raw = (p < duty) ? 1.0 : -1.0;
                                        else if (type === 'triangle') {
                                            raw = (p < duty) ? (-1.0 + 2.0 * (p / duty)) : (1.0 - 2.0 * ((p - duty) / (1.0 - duty)));
                                        } else if (type === 'sawtooth') raw = 2.0 * p - 1.0;
                                        else if (type === 'ramp') raw = 1.0 - 2.0 * p;

                                        output[i] = isUnipolar ? (raw + 1.0) * 0.5 * depth : raw * depth;
                                    }
                                    return true;
                                }
                            }
                            registerProcessor('lfo-processor', LfoProcessor);

                            class MathProcessor extends AudioWorkletProcessor {
                                constructor() {
                                    super();
                                    this.exprFunc = (A, B, C) => A + B;
                                    this.compileExpr('A + B');
                                    this.port.onmessage = (e) => {
                                        if (e.data.type === 'SET_EXPR') {
                                            this.compileExpr(e.data.expr);
                                        }
                                    };
                                }
                                compileExpr(exprStr) {
                                    if (!exprStr || typeof exprStr !== 'string') return;
                                    try {
                                        let s = exprStr.trim();
                                        s = s.replace(/\\b([abc])\\b/g, (m, g) => g.toUpperCase());
                                        const fn = new Function('A', 'B', 'C', 'clamp', 'min', 'max', 'abs', 'sin', 'cos', 'round', 'PI', 'return (' + s + ');');
                                        this.exprFunc = fn;
                                    } catch (err) {}
                                }
                                process(inputs, outputs, parameters) {
                                    const out = outputs[0] ? outputs[0][0] : null;
                                    if (!out) return true;
                                    const len = out.length;
                                    const inA = (inputs[0] && inputs[0][0]) ? inputs[0][0] : null;
                                    const inB = (inputs[1] && inputs[1][0]) ? inputs[1][0] : null;
                                    const inC = (inputs[2] && inputs[2][0]) ? inputs[2][0] : null;

                                    const fn = this.exprFunc;
                                    const clamp = (v, mn, mx) => Math.max(mn, Math.min(mx, v));
                                    const min = Math.min;
                                    const max = Math.max;
                                    const abs = Math.abs;
                                    const sin = Math.sin;
                                    const cos = Math.cos;
                                    const round = Math.round;
                                    const PI = Math.PI;

                                    for (let i = 0; i < len; i++) {
                                        const a = inA ? inA[i] : 0.0;
                                        const b = inB ? inB[i] : 0.0;
                                        const c = inC ? inC[i] : 0.0;
                                        let val = 0.0;
                                        try {
                                            val = fn(a, b, c, clamp, min, max, abs, sin, cos, round, PI);
                                        } catch (e) {
                                            val = 0.0;
                                        }
                                        if (isNaN(val) || !isFinite(val)) val = 0.0;
                                        out[i] = val;
                                    }
                                    return true;
                                }
                            }
                            registerProcessor('math-processor', MathProcessor);
                        `;
                        const blob = new Blob([workletCode], { type: 'application/javascript' });

                        }).catch(e => console.warn(e));
                    } catch(e) {}

        function applyStateDelta(targetGridState, targetConnections) {
            const getConnKey = (c) => `${c.from.cell}:${c.from.port}->${c.to.cell}:${c.to.port}`;
            const currentKeys = new Set(connections.map(getConnKey));
            const targetKeys = new Set(targetConnections.map(getConnKey));

            // 1. Module diff application (existing code)
            for (let i = 0; i < COLS * ROWS; i++) {
                const currentMod = gridState[i];
                const targetMod = targetGridState[i];

                if (!targetMod && currentMod) {
                    if (moduleInstances[i]) {
                        moduleInstances[i].destroy();
                        delete moduleInstances[i];
                    }
                } else if (targetMod && !currentMod) {
                    addModuleInstance(i, targetMod);
                } else if (targetMod && currentMod) {
                    if (targetMod.type !== currentMod.type) {
                        if (moduleInstances[i]) {
                            moduleInstances[i].destroy();
                            delete moduleInstances[i];
                        }
                        addModuleInstance(i, targetMod);
                    } else {
                        if (moduleInstances[i]) {
                            moduleInstances[i].data = targetMod;
                            moduleInstances[i].updateParam(targetMod);
                        } else {
                            addModuleInstance(i, targetMod);
                        }
                    }
                }
            }

            // 2. Make-Before-Break for Cables: Connect NEW cables FIRST before disconnecting OLD ones
            targetConnections.forEach(conn => {
                if (!currentKeys.has(getConnKey(conn))) {
                    connectCable(conn);
                }
            });

            connections.forEach(conn => {
                if (!targetKeys.has(getConnKey(conn))) {
                    disconnectCable(conn);
                }
            });

            // 3. Update internal state lists
            gridState = targetGridState;
            connections = targetConnections;

            // 4. Final parameter refresh
            Object.values(moduleInstances).forEach(inst => {
                inst.updateParam(inst.data);
            });
        }
