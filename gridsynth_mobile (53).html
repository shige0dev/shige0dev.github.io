                        { cv: 0.0, active: true, cvActive: true, gate: true },
                        { cv: 0.167, active: true, cvActive: true, gate: true },
                        { cv: 0.333, active: true, cvActive: true, gate: true },
                        { cv: 0.417, active: true, cvActive: true, gate: true },
                        { cv: 0.583, active: true, cvActive: true, gate: true },
                        { cv: 0.75, active: true, cvActive: true, gate: true },
                        { cv: 0.917, active: true, cvActive: true, gate: true },
                        { cv: 1.0, active: true, cvActive: true, gate: true }
                    ];
                    this.currentStep = -1;

                    this.worklet = new AudioWorkletNode(ctx, 'seq-processor', {
                        numberOfInputs: 1,
                        numberOfOutputs: 2,
                        outputChannelCount: [1, 1]
                    });
                    this.worklet.port.postMessage({ type: 'SET_STEPS', steps: this.steps });
                    this.worklet.port.onmessage = (e) => {
                        if (e.data.type === 'STEP') {
                            this.currentStep = e.data.step;
                        }
                    };

                    this.cvOutGain = ctx.createGain();
                    this.gateOutGain = ctx.createGain();
                    this.worklet.connect(this.cvOutGain, 0, 0);
                    this.worklet.connect(this.gateOutGain, 1, 0);

                    this.gateInput = ctx.createGain();
                    this.gateInput.connect(this.worklet, 0, 0);

                    this.inputNode = this.gateInput;
                    this.outputNode = this.cvOutGain;
                    this.inputs = { gate_in: this.gateInput, clk: this.gateInput, gate: this.gateInput, in: this.gateInput };
                    this.outputs = { cv_out: this.cvOutGain, cv: this.cvOutGain, gate_out: this.gateOutGain, gate: this.gateOutGain, out: this.cvOutGain };
                }

                // Prevent mobile Chromium silence/sleep optimization by routing all CV/Worklet signals into inaudible destination keep-alive
                if (masterKeepAliveGain) {
                    if (this.worklet) {
                        try { this.worklet.connect(masterKeepAliveGain); } catch(e) {}
                    }
                    if (this.gateOutGain) {
                        try { this.gateOutGain.connect(masterKeepAliveGain); } catch(e) {}
                    }
                    if (this.cvOutGain) {
                        try { this.cvOutGain.connect(masterKeepAliveGain); } catch(e) {}
                    }
                    if (this.outputGain) {
                        try { this.outputGain.connect(masterKeepAliveGain); } catch(e) {}
                    }
                    if (this.outputNode && this.outputNode !== ctx.destination && this.outputNode !== this.worklet && this.outputNode !== this.outputGain && this.outputNode !== this.cvOutGain) {
                        try { this.outputNode.connect(masterKeepAliveGain); } catch(e) {}
                    }
                }
            }

            setRunning(isRunning) {
                if (this.type === 'CLK') {
                    if (this.worklet) {
                        this.worklet.port.postMessage({ type: 'SET_STATE', running: isRunning });
                    }
                }
            }

            startNoiseSource(type) {
                const ctx = getAudioContext();
                if (this.noiseSource) {
                    try { this.noiseSource.stop(); this.noiseSource.disconnect(); } catch(e) {}
                }
                const bufferSize = ctx.sampleRate * 2;
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);

                if (type === 'white') {
                    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                } else if (type === 'pink') {
                    let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
                    for (let i = 0; i < bufferSize; i++) {
                        let white = Math.random() * 2 - 1;
                        b0 = 0.99886 * b0 + white * 0.0555179;
                        b1 = 0.99332 * b1 + white * 0.0750759;
                        b2 = 0.96900 * b2 + white * 0.1538520;
                        b3 = 0.86650 * b3 + white * 0.3104856;
                        b4 = 0.55000 * b4 + white * 0.5329522;
                        b5 = -0.7616 * b5 - white * 0.0168980;
                        data[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.11;
                        b6 = white * 0.115926;
                    }
                } else if (type === 'brown') {
                    let lastOut = 0.0;
                    for (let i = 0; i < bufferSize; i++) {
                        let white = Math.random() * 2 - 1;
                        data[i] = (lastOut + (0.02 * white)) / 1.02;
                        lastOut = data[i];
                        data[i] *= 3.5;
                    }
                }

                this.noiseSource = ctx.createBufferSource();
                this.noiseSource.buffer = buffer;
                this.noiseSource.loop = true;
                this.noiseSource.connect(this.filter);
                this.noiseSource.start();
            }

            calcFoldCurve(fold, bias = 0.0) {
                const n = 1024;
                const curve = new Float32Array(n);
                const drive = 1.0 + fold * 3.0;
                for (let i = 0; i < n; i++) {
                    let x = (i * 2) / n - 1;
                    let val = (x + bias) * drive;
                    for (let iter = 0; iter < 10; iter++) {
                        if (val > 1.0) val = 2.0 - val;
                        else if (val < -1.0) val = -2.0 - val;
                        else break;
                    }
                    curve[i] = Math.max(-1.0, Math.min(1.0, val * 0.85));
                }
                return curve;
            }

            getCurrentValue(channelIndex = 0) {
                const an = (this.analysers && this.analysers[channelIndex]) ? this.analysers[channelIndex] : (this.outAnalyser || this.analyser);
                if (!an) return 0;
                const buffer = new Float32Array(an.fftSize);
                an.getFloatTimeDomainData(buffer);
                return buffer[0] || 0;
            }

            setKeyNote(midi, isDown) {
                if (!this.pitchSource || !this.gateSource) return;
                const ctx = getAudioContext();
                const now = ctx.currentTime;
                const volt = (midi - 24) / 12.0;
                this.pitchSource.offset.setTargetAtTime(volt, now, 0.005);
                this.gateSource.offset.setTargetAtTime(isDown ? 1.0 : 0.0, now, 0.005);
            }

            updateParam(newData) {
                this.data = newData;
                const ctx = getAudioContext();
                const now = ctx.currentTime;

                if (this.type === 'VCO' && this.osc) {
                    const isPatched = isVcoPatched(this.cellIndex);
                    const targetFreq = isPatched ? 32.703 : (newData.freq || 220);
                    this.osc.frequency.setTargetAtTime(targetFreq, now, 0.02);
                    if (newData.wave) this.osc.type = newData.wave.toLowerCase();
                } else if (this.type === 'VCF' && this.filter) {
                    if (newData.cutoff !== undefined) this.filter.frequency.setTargetAtTime(Math.max(20, Math.min(18000, newData.cutoff)), now, 0.02);
                    if (newData.q !== undefined) this.filter.Q.setTargetAtTime(Math.max(0.1, Math.min(25, newData.q)), now, 0.02);
                    if (newData.filterType) this.filter.type = newData.filterType.toLowerCase();
                    if (this.cvGain) {
                        const isCvPatched = isPortPatched(this.cellIndex, 'cv');
                        const targetMod = isCvPatched ? 1200 : (newData.modDepth !== undefined ? newData.modDepth : 1200);
                        this.cvGain.gain.setTargetAtTime(targetMod, now, 0.02);
                    }
                } else if (this.type === 'VCA' && this.vcaGain) {
                    const isCvPatched = isPortPatched(this.cellIndex, 'cv');
                    const targetLevel = isCvPatched ? 0.0 : (newData.level !== undefined ? newData.level : 1.0);
                    this.vcaGain.gain.setTargetAtTime(Math.max(0.0, Math.min(1.0, targetLevel)), now, 0.02);
                    if (this.cvGain && newData.cvDepth !== undefined) this.cvGain.gain.setTargetAtTime(Math.max(0.0, Math.min(2.0, newData.cvDepth)), now, 0.02);
                } else if (this.type === 'FOLD') {
                    if (newData.wave && this.carrierOsc) this.carrierOsc.type = newData.wave.toLowerCase();
                    if (this.shaper) this.shaper.curve = this.calcFoldCurve(newData.fold !== undefined ? newData.fold : 1.5, newData.bias || 0.0);
                    if (this.cvGain) {
                        const isCvPatched = isPortPatched(this.cellIndex, 'cv');
                        const targetCv = isCvPatched ? 1.0 : (newData.cvDepth !== undefined ? newData.cvDepth : 1.0);
                        this.cvGain.gain.setTargetAtTime(targetCv, now, 0.02);
                    }
                } else if (this.type === 'ADSR') {
                    this.data.attack = newData.attack !== undefined ? newData.attack : 0.02;
                    this.data.decay = newData.decay !== undefined ? newData.decay : 0.2;
                    this.data.sustain = newData.sustain !== undefined ? newData.sustain : 0.6;
                    this.data.release = newData.release !== undefined ? newData.release : 0.4;
                    if (this.worklet) {
                        this.worklet.port.postMessage({
                            type: 'SET_PARAMS',
                            attack: this.data.attack,
                            decay: this.data.decay,
                            sustain: this.data.sustain,
                            release: this.data.release
                        });
                    }
                } else if (this.type === 'LFO') {
                    if (this.worklet) {
                        if (newData.rate !== undefined) {
                            const p = this.worklet.parameters.get('rate');
                            if (p) p.setTargetAtTime(Math.max(0.01, newData.rate), now, 0.02);
                        }
                        if (newData.depth !== undefined) {
                            const p = this.worklet.parameters.get('depth');
                            if (p) p.setTargetAtTime(Math.max(0.0, newData.depth), now, 0.02);
                        }
                        if (newData.duty !== undefined) {
                            const p = this.worklet.parameters.get('duty');
                            if (p) p.setTargetAtTime(Math.max(0.01, Math.min(0.99, newData.duty)), now, 0.02);
                        }
                        this.worklet.port.postMessage({ type: 'SET_CONFIG', waveType: newData.waveType || 'sine', polarity: newData.polarity || 'bipolar' });
                    }
                } else if (this.type === 'CLK') {
                    if (newData.bpm !== undefined) {
                        if (this.worklet) {
                            const p = this.worklet.parameters.get('bpm');
                            if (p) p.setValueAtTime(newData.bpm, now);
                        }
                    }
                    if (newData.pulseWidthMs !== undefined && this.worklet) {
                        this.pulseWidthMs = newData.pulseWidthMs;
                        const p = this.worklet.parameters.get('pulseWidthMs');
                        if (p) p.setValueAtTime(newData.pulseWidthMs, now);
                    }
                    if (newData.div !== undefined && this.worklet) {
                        this.div = newData.div;
                        this.worklet.port.postMessage({ type: 'SET_STATE', div: newData.div });
                    }
                } else if (this.type === 'SEQ') {
                    if (newData.steps) {
                        this.steps = newData.steps;
                        if (this.worklet) this.worklet.port.postMessage({ type: 'SET_STEPS', steps: this.steps });
                    }
                } else if (this.type === 'DELAY' && this.delay) {
                    if (newData.delayTime !== undefined) this.delay.delayTime.setTargetAtTime(Math.max(0.01, Math.min(2.0, newData.delayTime)), now, 0.02);
                    if (this.feedback && newData.feedback !== undefined) this.feedback.gain.setTargetAtTime(Math.max(0.0, Math.min(0.95, newData.feedback)), now, 0.02);
                    if (this.wetGain && this.dryGain && newData.mix !== undefined) {
                        this.wetGain.gain.setTargetAtTime(Math.max(0.0, Math.min(1.0, newData.mix)), now, 0.02);
                        this.dryGain.gain.setTargetAtTime(1.0 - newData.mix * 0.3, now, 0.02);
                    }
                    if (this.timeCvGain && newData.cvDepth !== undefined) this.timeCvGain.gain.setTargetAtTime(Math.max(0.0, Math.min(0.5, newData.cvDepth)), now, 0.02);
                } else if (this.type === 'MIX') {
                    this.channels = newData.channels || 2;
                    for (let c = 1; c <= 4; c++) {
                        if (this[`in${c}`] && newData[`lvl${c}`] !== undefined) {
                            this[`in${c}`].gain.setTargetAtTime(Math.max(0.0, Math.min(1.0, newData[`lvl${c}`])), now, 0.02);
                        }
                    }
                } else if (this.type === 'SLIDER' && this.sourceNode) {
                    this.sourceNode.offset.setTargetAtTime(newData.vol !== undefined ? newData.vol : 0.7, now, 0.02);
                } else if (this.type === 'NOISE') {
                    if (newData.noiseType && newData.noiseType !== this.data.noiseType) this.startNoiseSource(newData.noiseType);
                    if (this.filter && newData.tone !== undefined) this.filter.frequency.setTargetAtTime(Math.max(100, Math.min(16000, newData.tone)), now, 0.02);
                    if (this.outputGain && newData.level !== undefined) this.outputGain.gain.setTargetAtTime(Math.max(0.0, Math.min(1.0, newData.level)), now, 0.02);
                } else if (this.type === 'TOGGLE' && this.toggleGain) {
                    const isThru = (newData.state !== undefined) ? Boolean(newData.state) : true;
                    this.toggleGain.gain.setTargetAtTime(isThru ? 1.0 : 0.0, now, 0.003);
                } else if (this.type === 'MATH') {
                    if (this.worklet && newData.expr) this.worklet.port.postMessage({ type: 'SET_EXPR', expr: newData.expr });
                } else if (this.type === 'SPEAKER' && this.masterGain) {
                    if (newData.masterVol !== undefined) this.masterGain.gain.setTargetAtTime(newData.masterVol, now, 0.02);
                }
            }

            getInput(port) {
                return (this.inputs && this.inputs[port]) || this.inputNode || null;
            }

            getOutput(port) {
                return (this.outputs && this.outputs[port]) || null;
            }

            destroy() {
                try {
                    ['osc', 'carrierOsc', 'noiseSource', 'sourceNode', 'pitchSource', 'gateSource'].forEach(key => {
                        if (this[key] && typeof this[key].stop === 'function') {
                            try { this[key].stop(); } catch(e) {}
                        }
                    });

                    Object.values(this).forEach(val => {
                        if (val && typeof val.disconnect === 'function') {
                            try { val.disconnect(); } catch(e) {}
                        } else if (Array.isArray(val)) {
                            val.forEach(item => {
                                if (item && typeof item.disconnect === 'function') {
                                    try { item.disconnect(); } catch(e) {}
                                }
                            });
                        }
                    });
                } catch(e) {}
            }
        }

        function rebuildAudioFromState(newState, newConns) {
            Object.values(moduleInstances).forEach(m => m.destroy());
            moduleInstances = {};

            newState.forEach((mod, idx) => {
                if (mod) {
                    moduleInstances[idx] = new SynthModuleAudio(mod.type, mod, idx);
                }
            });

            newConns.forEach(conn => {
                const srcMod = moduleInstances[conn.from.cell];
                const dstMod = moduleInstances[conn.to.cell];
                if (srcMod && dstMod) {
                    try {
                        const outObj = srcMod.getOutput(conn.from.port);
                        const inObj = dstMod.getInput(conn.to.port);
                        if (outObj && inObj) {
                            outObj.connect(inObj);
                        }
                    } catch(e) {}
                }
            });

            Object.entries(moduleInstances).forEach(([idx, mod]) => {
                mod.updateParam(mod.data);
            });
        }

        function addModuleInstance(cellIndex, modData) {
            if (moduleInstances[cellIndex]) {
                moduleInstances[cellIndex].destroy();
                delete moduleInstances[cellIndex];
            }
            const mod = new SynthModuleAudio(modData.type, modData, cellIndex);
            moduleInstances[cellIndex] = mod;

            if (modData.type === 'CLK' && seqTransportState === 'playing') {
                mod.setRunning(true);
            }

            connections.forEach(conn => {
                if (conn.from.cell === cellIndex) {
                    const dstMod = moduleInstances[conn.to.cell];
                    if (dstMod) {
                        try {
                            const outObj = mod.getOutput(conn.from.port);
                            const inObj = dstMod.getInput(conn.to.port);
                            if (outObj && inObj) outObj.connect(inObj);
                        } catch(e) {}
                    }
                } else if (conn.to.cell === cellIndex) {
                    const srcMod = moduleInstances[conn.from.cell];
                    if (srcMod) {
                        try {
                            const outObj = srcMod.getOutput(conn.from.port);
                            const inObj = mod.getInput(conn.to.port);
                            if (outObj && inObj) outObj.connect(inObj);
                        } catch(e) {}
                    }
                }
            });

            mod.updateParam(modData);
        }

        function connectCable(conn) {
            const srcMod = moduleInstances[conn.from.cell];
            const dstMod = moduleInstances[conn.to.cell];
            if (srcMod && dstMod) {
                try {
                    const outObj = srcMod.getOutput(conn.from.port);
                    const inObj = dstMod.getInput(conn.to.port);
                    if (outObj && inObj) {
                        outObj.connect(inObj);
                    }
                } catch(e) {}
                srcMod.updateParam(srcMod.data);
                dstMod.updateParam(dstMod.data);
            }
        }

        function disconnectCable(conn) {
            const srcMod = moduleInstances[conn.from.cell];
            const dstMod = moduleInstances[conn.to.cell];
            if (srcMod && dstMod) {
                try {
                    const outObj = srcMod.getOutput(conn.from.port);
                    const inObj = dstMod.getInput(conn.to.port);
                    if (outObj && inObj) {
                        try {
                            // Make-Before-Break: Ensure keep-alive or parallel path exists before disconnecting
                            if (masterKeepAliveGain && outObj !== getAudioContext().destination) {
                                try { outObj.connect(masterKeepAliveGain); } catch(e) {}
                            }
                            outObj.disconnect(inObj);
                        } catch(err) {
                            outObj.disconnect();
                            if (masterKeepAliveGain && outObj !== getAudioContext().destination) {
                                try { outObj.connect(masterKeepAliveGain); } catch(e) {}
                            }
                            connections.forEach(c => {
                                if (c !== conn && c.from.cell === conn.from.cell && c.from.port === conn.from.port) {
                                    const target = moduleInstances[c.to.cell]?.getInput(c.to.port);
                                    if (target) try { outObj.connect(target); } catch(e) {}
                                }
                            });
                        }
                    }
                } catch(e) {}
                srcMod.updateParam(srcMod.data);
                dstMod.updateParam(dstMod.data);
            }
        }

        function renderCables() {
            if (!cableCanvas) return;
            cableCanvas.innerHTML = '';
            const canvasRect = cableCanvas.getBoundingClientRect();
            connections.forEach(conn => {
                const fromEl = document.querySelector(`[data-cell="${conn.from.cell}"][data-port="${conn.from.port}"]`);
                const toEl = document.querySelector(`[data-cell="${conn.to.cell}"][data-port="${conn.to.port}"]`);
                if (!fromEl || !toEl) return;

                const r1 = fromEl.getBoundingClientRect();
                const r2 = toEl.getBoundingClientRect();

                const x1 = r1.left + r1.width/2 - canvasRect.left;
                const y1 = r1.top + r1.height/2 - canvasRect.top;
                const x2 = r2.left + r2.width/2 - canvasRect.left;
                const y2 = r2.top + r2.height/2 - canvasRect.top;

                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                const dist = Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
                const curveY = Math.max(dist * 0.4, 15);
                
                path.setAttribute('d', `M ${x1} ${y1} C ${x1} ${y1 + curveY}, ${x2} ${y2 + curveY}, ${x2} ${y2}`);
                const isCv = (conn.to.port.includes('cv') || conn.to.port.includes('gate') || conn.from.port.includes('cv') || conn.from.port.includes('gate') || conn.to.port === 'rateCv' || conn.from.port === 'pitch' || conn.from.port === 'clk' || conn.to.port === 'clk');
                const isTrig = (conn.to.port === 'trig');
                const isMathIn = (conn.to.port === 'a' || conn.to.port === 'b' || conn.to.port === 'c');
                path.setAttribute('stroke', isCv ? '#f59e0b' : (isTrig ? '#ec4899' : (isMathIn ? '#c084fc' : '#38bdf8')));
                path.setAttribute('stroke-width', '4');
                path.setAttribute('fill', 'none');
                path.setAttribute('stroke-linecap', 'round');
                path.style.filter = 'drop-shadow(0px 4px 3px rgba(0,0,0,0.9))';
                cableCanvas.appendChild(path);
            });
        }

        function updateCell(index) {
            const cell = document.getElementById(`cell-${index}`);
            if (!cell) return;
            const mod = gridState[index];
            
            let baseClasses = "grid-cell relative aspect-square border transition-all select-none overflow-hidden touch-none ";
            if (mod) {
                baseClasses += "border-slate-600 bg-white/10 backdrop-blur-sm shadow-md shadow-black/50 ";
                if (selectedModules.includes(index)) {
                    baseClasses += "selected-module ";
                }
            } else {
                baseClasses += "border-dashed border-slate-700/50 cursor-pointer empty-cell ";
            }
            cell.className = baseClasses;

            if (mod) {
                let html = `
                    <div class="absolute top-[2px] left-[3px] right-[3px] flex justify-between items-center pointer-events-none z-20">
                        <span class="font-bold text-[8px] tracking-wider text-slate-400 drop-shadow-md" style="line-height: 0.8;">${mod.type}</span>
                    </div>
                    <div class="absolute inset-0 flex flex-col items-center justify-center module-body cursor-pointer p-1 z-0 pt-3 pb-3" data-index="${index}">
                        ${getModuleInnerHTML(mod, index)}
                    </div>`;

                const spec = MODULE_PORT_SPECS[mod.type];
                if (spec) {
                    const inPorts = typeof spec.getIn === 'function' ? spec.getIn(mod) : (spec.in || []);
                    const outPorts = typeof spec.getOut === 'function' ? spec.getOut(mod) : (spec.out || []);

                    const renderPortGroup = (ports) => ports.map(p => {
                        const bgClass = p.color.startsWith('bg-') ? p.color : (p.color.includes('-') ? `bg-${p.color}` : `bg-${p.color}-500`);
                        return `<div class="w-2 h-2 rounded-full ${bgClass} port cursor-pointer hover:scale-150 transition relative before:absolute before:inset-[-4px] before:content-['']" data-cell="${index}" data-port="${p.port}" title="${p.title || ''}"></div>`;
                    }).join('');

                    html += `
                    <div class="absolute bottom-[2px] left-[2px] right-[2px] flex justify-between items-end pointer-events-none z-10 px-0.5">
                        <div class="flex items-center gap-1 pointer-events-auto">${renderPortGroup(inPorts)}</div>
                        <div class="flex items-center gap-1 pointer-events-auto">${renderPortGroup(outPorts)}</div>
                    </div>`;
                }
                cell.innerHTML = html;
            } else {
                const cellNumStr = String(index).padStart(2, '0');
                cell.innerHTML = `<div class="absolute inset-0 flex items-center justify-center font-bold text-sm text-black opacity-20 select-none pointer-events-none">${cellNumStr}</div>`;
            }
        }

        function initGrid() {
            if (!gridBoard) return;
            gridBoard.innerHTML = '';
            for (let i = 0; i < COLS * ROWS; i++) {
                const cell = document.createElement('div');
                cell.id = `cell-${i}`;
                cell.dataset.index = i;
                gridBoard.appendChild(cell);
            }
            updateAllCells();
            setTimeout(renderCables, 50);
        }

        function updateAllCells() {
            for (let i = 0; i < COLS * ROWS; i++) updateCell(i);
            updatePortHighlight();
            updateUndoButtonState();
        }

        function isOutputPort(cellIdx, portName) {
            const inst = moduleInstances[cellIdx];
            if (inst && inst.outputs && (portName in inst.outputs)) return true;
            const mod = gridState[cellIdx];
            if (!mod) return false;
            const spec = MODULE_PORT_SPECS[mod.type];
            if (!spec) return (portName === 'out');
            const outPorts = typeof spec.getOut === 'function' ? spec.getOut(mod) : (spec.out || []);
            return outPorts.some(p => p.port === portName);
        }

        function handlePortTap(cellIdx, portType) {
            const currentPortInfo = { cell: cellIdx, port: portType };

            if (!selectedTargetForConnection) {
                selectedTargetForConnection = currentPortInfo;
                showToast(`接続先をタップしてください`);
                updatePortHighlight();
            } else {
                const first = selectedTargetForConnection;
                const second = currentPortInfo;
                if (first.cell === second.cell) {
                    showToast('同じモジュール同士は結線不可です');
                } else {
                    const isOut1 = isOutputPort(first.cell, first.port);
                    const isOut2 = isOutputPort(second.cell, second.port);

                    if (isOut1 === isOut2) {
                        showToast(isOut1 ? 'OUT同士は接続できません' : 'IN同士は接続できません');
                    } else {
                        const sourceNode = isOut1 ? first : second;
                        const targetNode = isOut1 ? second : first;

                        const isDuplicate = connections.some(c => 
                            c.from.cell === sourceNode.cell && c.from.port === sourceNode.port &&
                            c.to.cell === targetNode.cell && c.to.port === targetNode.port
                        );
                        if (isDuplicate) {
                            showToast('すでに接続されています');
                        } else {
                            saveHistory();
                            const newConn = { from: sourceNode, to: targetNode };
                            connections.push(newConn);
                            connectCable(newConn);
                            showToast('ケーブルを結線しました！');
                            updateCell(sourceNode.cell);
                            updateCell(targetNode.cell);
                            renderCables();
                            saveActivePresetAuto();
                        }
                    }
                }
                selectedTargetForConnection = null;
                updatePortHighlight();
            }
        }

        function deleteSelectedModules() {
            if (selectedModules.length === 0) return;
            saveHistory();
            const count = selectedModules.length;
            const affected = [...selectedModules];
            selectedModules.forEach(cellIdx => {
                const removed = connections.filter(c => c.from.cell === cellIdx || c.to.cell === cellIdx);
                removed.forEach(disconnectCable);
                connections = connections.filter(c => c.from.cell !== cellIdx && c.to.cell !== cellIdx);
                if (moduleInstances[cellIdx]) {
                    moduleInstances[cellIdx].destroy();
                    delete moduleInstances[cellIdx];
                }
                gridState[cellIdx] = null;
            });
            selectedModules = [];
            showToast(`${count}個のパーツを削除しました`);
            affected.forEach(idx => updateCell(idx));
            renderCables();
            saveActivePresetAuto();
        }

        gridBoard.addEventListener('click', (e) => {
            const portEl = e.target.closest('.port');
            if (portEl) {
                if (portLongPressed) {
                    portLongPressed = false;
                    return;
                }
                const cellIdx = parseInt(portEl.dataset.cell);
                const portType = portEl.dataset.port;
                handlePortTap(cellIdx, portType);
                return;
            }

            const bodyEl = e.target.closest('.module-body');
            if (bodyEl) {
                const cellIdx = parseInt(bodyEl.dataset.index);
                
                if (selectedModules.length > 0) {
                    if (selectedModules.includes(cellIdx)) {
                        deleteSelectedModules();
                    } else {
                        showToast('複数選択中は操作できません');
                    }
                    return;
                }

                if (selectedTargetForConnection) return showToast('結線中です');
                if (movingModuleIndex !== null || isDragging) return;

                // Single-tap toggle state switching for TOGGLE module
                if (gridState[cellIdx] && gridState[cellIdx].type === 'TOGGLE') {
                    saveHistory();
                    const mod = gridState[cellIdx];
                    mod.state = (mod.state !== undefined) ? !mod.state : false;
                    if (moduleInstances[cellIdx]) moduleInstances[cellIdx].updateParam(mod);
                    updateCell(cellIdx);
                    saveActivePresetAuto();
                    showToast(mod.state ? 'TOGGLE: ON' : 'TOGGLE: OFF');
                    return;
                }

                const now = Date.now();
                const isDoubleTap = (now - lastModuleTapTime < 350) && (lastModuleTapIndex === cellIdx);

                if (isDoubleTap) {
                    lastModuleTapTime = 0;
                    lastModuleTapIndex = null;
                    openSettingsModal(cellIdx);
                } else {
                    lastModuleTapTime = now;
                    lastModuleTapIndex = cellIdx;
                }
                return;
            }

            const emptyCell = e.target.closest('.empty-cell');
            if (emptyCell) {
                if (selectedTargetForConnection) return showToast('結線中です');
                if (!isDragging) {
                    const targetIdx = parseInt(emptyCell.dataset.index);
                    const now = Date.now();
                    const isDoubleTap = (now - lastEmptyCellTapTime < 350) && (lastEmptyCellTapIndex === targetIdx);

                    if (isDoubleTap) {
                        lastEmptyCellTapTime = 0;
                        lastEmptyCellTapIndex = null;
                        if (selectedModules.length > 0) {
                            selectedModules = [];
                            updateAllCells();
                        }
                        openAddModal(targetIdx);
                    } else {
                        lastEmptyCellTapTime = now;
                        lastEmptyCellTapIndex = targetIdx;
                    }
                }
            }
        });

        function createGroupDragGhost(baseIndex) {
            dragGhost = document.createElement('div');
            dragGhost.style.position = 'fixed';
            dragGhost.style.pointerEvents = 'none';
            dragGhost.style.zIndex = '9999';
            dragGhost.style.transformOrigin = '0 0';
            
            const baseCell = document.getElementById(`cell-${baseIndex}`);
            const baseRect = baseCell.getBoundingClientRect();
            const baseRow = Math.floor(baseIndex / COLS);
            const baseCol = baseIndex % COLS;
            
            dragGroupOffsets = [];
            selectedModules.forEach(idx => {
                const row = Math.floor(idx / COLS);
                const col = idx % COLS;
                const dRow = row - baseRow;
                const dCol = col - baseCol;
                
                dragGroupOffsets.push({ originalIdx: idx, dRow, dCol });
                
                const cell = document.getElementById(`cell-${idx}`);
                const clone = cell.cloneNode(true);
                clone.classList.add('absolute', 'shadow-2xl', 'scale-105');
                clone.classList.remove('transition-all', 'opacity-30', 'selected-module', 'relative');
                
                const rect = cell.getBoundingClientRect();
                clone.style.width = rect.width + 'px';
                clone.style.height = rect.height + 'px';
                clone.style.left = (rect.left - baseRect.left) + 'px';
                clone.style.top = (rect.top - baseRect.top) + 'px';
                dragGhost.appendChild(clone);
            });
            
            dragGhost.classList.add('opacity-80');
            dragGhostOffsetX = startX - baseRect.left;
            dragGhostOffsetY = startY - baseRect.top;
            dragGhost.style.left = '0px';
            dragGhost.style.top = '0px';
            dragGhost.style.transform = `translate3d(${startX - dragGhostOffsetX}px, ${startY - dragGhostOffsetY}px, 0)`;
            document.body.appendChild(dragGhost);
        }

        function checkDropValid(baseTargetIdx) {
            const targetRow = Math.floor(baseTargetIdx / COLS);
            const targetCol = baseTargetIdx % COLS;
            for (let offset of dragGroupOffsets) {
                const destRow = targetRow + offset.dRow;
                const destCol = targetCol + offset.dCol;
                if (destRow < 0 || destRow >= ROWS || destCol < 0 || destCol >= COLS) return false;
                const destIdx = destRow * COLS + destCol;
                if (dragMode === 'copy') {
                    if (gridState[destIdx] !== null) return false;
                } else {
                    if (gridState[destIdx] !== null && !selectedModules.includes(destIdx)) return false;
                }
            }
            return true;
        }

        function highlightDropTarget(baseTargetIdx, isValid) {
            const targetRow = Math.floor(baseTargetIdx / COLS);
            const targetCol = baseTargetIdx % COLS;
            for (let i = 0; i < dragGroupOffsets.length; i++) {
                let offset = dragGroupOffsets[i];
                const destRow = targetRow + offset.dRow;
                const destCol = targetCol + offset.dCol;
                let isInside = (destRow >= 0 && destRow < ROWS && destCol >= 0 && destCol < COLS);
                if (isInside) {
                    const destIdx = destRow * COLS + destCol;
                    const cell = document.getElementById(`cell-${destIdx}`);
                    if (cell) {
                        cell.dataset.isHighlight = "true";
                        if (isValid) {
                            if (dragMode === 'copy') cell.classList.add('drop-highlight-copy-valid');
                            else cell.classList.add('drop-highlight-valid');
                        } else {
                            cell.classList.add('drop-highlight-invalid');
                        }
                    }
                }
            }
        }

        function clearDropHighlight() {
            document.querySelectorAll('[data-is-highlight="true"]').forEach(cell => {
                cell.classList.remove('drop-highlight-valid', 'drop-highlight-invalid', 'drop-highlight-copy-valid');
                delete cell.dataset.isHighlight;
            });
        }

        gridBoard.addEventListener('pointerdown', (e) => {
            if (e.button !== 0 && e.pointerType === 'mouse') return;

            const portEl = e.target.closest('.port');
            if (portEl) {
                const cellIdx = parseInt(portEl.dataset.cell);
                const portType = portEl.dataset.port;
                startX = e.clientX;
                startY = e.clientY;
                portLongPressed = false;

                if (portLongPressTimer) clearTimeout(portLongPressTimer);
                portLongPressTimer = setTimeout(() => {
                    portLongPressTimer = null;
                    portLongPressed = true;
                    const prevCount = connections.length;
                    const newConns = connections.filter(c => 
                        !(c.from.cell === cellIdx && c.from.port === portType) &&
                        !(c.to.cell === cellIdx && c.to.port === portType)
                    );
                    if (newConns.length < prevCount) {
                        saveHistory();
                        const removed = connections.filter(c => 
                            (c.from.cell === cellIdx && c.from.port === portType) ||
                            (c.to.cell === cellIdx && c.to.port === portType)
                        );
                        connections = newConns;
                        removed.forEach(disconnectCable);
                        if (selectedTargetForConnection && selectedTargetForConnection.cell === cellIdx && selectedTargetForConnection.port === portType) {
                            selectedTargetForConnection = null;
                            updatePortHighlight();
                        }
                        updateAllCells();
                        renderCables();
                        saveActivePresetAuto();
                        showToast('端子のケーブルを切断しました');
                    } else {
                        showToast('接続されているケーブルはありません');
                    }
                }, 500);
                return;
            }

            const bodyEl = e.target.closest('.module-body');
            if (bodyEl) {
                const index = parseInt(bodyEl.dataset.index);
                startX = e.clientX;
                startY = e.clientY;
                pendingDragIndex = index;
                
                longPressTimer = setTimeout(() => {
                    longPressTimer = null;
                    if (!selectedModules.includes(index)) {
                        selectedModules.push(index);
                    } else {
                        selectedModules = selectedModules.filter(i => i !== index);
                    }
                    updateCell(index);
                }, 400);
            }
        });

        function startGroupDrag(baseIndex) {
            movingModuleIndex = baseIndex;
            isDragging = true;
            dragMode = 'move';
            createGroupDragGhost(baseIndex);
            selectedModules.forEach(i => {
                const cell = document.getElementById(`cell-${i}`);
                if(cell) cell.classList.add('opacity-30');
            });
            
            if (dragModeTimer) clearTimeout(dragModeTimer);
            dragModeTimer = setTimeout(() => {
                if (isDragging) {
                    dragMode = 'copy';
                    if (dropTargetIndex !== null) {
                        clearDropHighlight();
                        dragGroupValid = checkDropValid(dropTargetIndex);
                        highlightDropTarget(dropTargetIndex, dragGroupValid);
                    }
                }
            }, 900);
        }

        window.addEventListener('pointermove', (e) => {
            if (portLongPressTimer) {
                if (Math.abs(e.clientX - startX) > 10 || Math.abs(e.clientY - startY) > 10) {
                    clearTimeout(portLongPressTimer);
                    portLongPressTimer = null;
                }
            }
            if (!isDragging && pendingDragIndex !== null) {
                if (Math.abs(e.clientX - startX) > 10 || Math.abs(e.clientY - startY) > 10) {
                    if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
                    if (!selectedModules.includes(pendingDragIndex)) selectedModules.push(pendingDragIndex);
                    startGroupDrag(pendingDragIndex);
                    pendingDragIndex = null;
                }
            }
            if (isDragging && dragGhost) {
                dragGhost.style.transform = `translate3d(${e.clientX - dragGhostOffsetX}px, ${e.clientY - dragGhostOffsetY}px, 0)`;
                const elUnderPointer = document.elementFromPoint(e.clientX, e.clientY);
                let newDropTarget = null;
                if (elUnderPointer) {
                    const targetCell = elUnderPointer.closest('.grid-cell');
                    if (targetCell) newDropTarget = parseInt(targetCell.dataset.index);
                }
                
                if (dropTargetIndex !== newDropTarget) {
                    clearDropHighlight();
                    dropTargetIndex = newDropTarget;
                    if (dropTargetIndex !== null) {
                        dragGroupValid = checkDropValid(dropTargetIndex);
                        highlightDropTarget(dropTargetIndex, dragGroupValid);
                    }
                }
            }
        });

        function cleanupDrag(isCancel = false) {
            if (portLongPressTimer) { clearTimeout(portLongPressTimer); portLongPressTimer = null; }
            if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
            if (dragModeTimer) { clearTimeout(dragModeTimer); dragModeTimer = null; }
            pendingDragIndex = null;
            if (isDragging) {
                isDragging = false;
                if (dragGhost) { dragGhost.remove(); dragGhost = null; }
                clearDropHighlight();
                
                selectedModules.forEach(i => {
                    const cell = document.getElementById(`cell-${i}`);
                    if(cell) cell.classList.remove('opacity-30');
                });
                
                if (!isCancel && dropTargetIndex !== null && dragGroupValid) {
                    saveHistory();
                    if (dragMode === 'copy') {
                        executeGroupCopy(dropTargetIndex);
                    } else {
                        if (movingModuleIndex !== dropTargetIndex) {
                            executeGroupMove(dropTargetIndex);
                        } else {
                            historyStack.pop();
                            updateUndoButtonState();
                        }
                    }
                } else if (!isCancel && dropTargetIndex !== null && !dragGroupValid) {
                    showToast('配置できない場所です');
                }
                
                movingModuleIndex = null;
                dropTargetIndex = null;
                dragMode = 'move';
            }
        }

        window.addEventListener('pointerup', () => cleanupDrag(false));
        window.addEventListener('pointercancel', () => cleanupDrag(true));

        function executeGroupMove(targetBaseIdx) {
            const targetRow = Math.floor(targetBaseIdx / COLS);
            const targetCol = targetBaseIdx % COLS;
            const tempState = [...gridState];
            const newPositions = {}; 
            
            dragGroupOffsets.forEach(offset => {
                const destRow = targetRow + offset.dRow;
                const destCol = targetCol + offset.dCol;
                const destIdx = destRow * COLS + destCol;
                newPositions[offset.originalIdx] = destIdx;
            });

            const affectedConns = connections.filter(conn => 
                newPositions[conn.from.cell] !== undefined || newPositions[conn.to.cell] !== undefined
            );
            affectedConns.forEach(disconnectCable);

            const movedInstances = {};
            Object.keys(newPositions).forEach(oldIdxStr => {
                const oldIdx = parseInt(oldIdxStr);
                const newIdx = newPositions[oldIdx];
                if (moduleInstances[oldIdx]) {
                    movedInstances[newIdx] = moduleInstances[oldIdx];
                    movedInstances[newIdx].cellIndex = newIdx;
                    delete moduleInstances[oldIdx];
                }
            });
            Object.assign(moduleInstances, movedInstances);

            dragGroupOffsets.forEach(offset => { gridState[offset.originalIdx] = null; });
            dragGroupOffsets.forEach(offset => {
                const destIdx = newPositions[offset.originalIdx];
                gridState[destIdx] = tempState[offset.originalIdx];
                if (gridState[destIdx]) {
                    gridState[destIdx].cell = destIdx;
                }
            });
            
            connections.forEach(conn => {
                if (newPositions[conn.from.cell] !== undefined) conn.from.cell = newPositions[conn.from.cell];
                if (newPositions[conn.to.cell] !== undefined) conn.to.cell = newPositions[conn.to.cell];
            });

            affectedConns.forEach(connectCable);

            Object.keys(newPositions).forEach(oldIdxStr => {
                const newIdx = newPositions[parseInt(oldIdxStr)];
                const inst = moduleInstances[newIdx];
                if (inst) {
                    inst.updateParam(inst.data);
                }
            });
            
            showToast(`${dragGroupOffsets.length}個のパーツを移動しました`);
            selectedModules = [];
            updateAllCells();
            setTimeout(renderCables, 50);
            saveActivePresetAuto();
        }

        function executeGroupCopy(targetBaseIdx) {
            const targetRow = Math.floor(targetBaseIdx / COLS);
            const targetCol = targetBaseIdx % COLS;
            const newPositions = {};

            dragGroupOffsets.forEach(offset => {
                const destRow = targetRow + offset.dRow;
                const destCol = targetCol + offset.dCol;
                const destIdx = destRow * COLS + destCol;
                newPositions[offset.originalIdx] = destIdx;
                
                const copiedData = JSON.parse(JSON.stringify(gridState[offset.originalIdx]));
                copiedData.cell = destIdx;
                gridState[destIdx] = copiedData;

                addModuleInstance(destIdx, copiedData);
            });
            
            const newCables = [];
            connections.forEach(conn => {
                if (newPositions[conn.from.cell] !== undefined && newPositions[conn.to.cell] !== undefined) {
                    const newConn = {
                        from: { cell: newPositions[conn.from.cell], port: conn.from.port },
                        to: { cell: newPositions[conn.to.cell], port: conn.to.port }
                    };
                    newCables.push(newConn);
                }
            });

            newCables.forEach(conn => {
                connections.push(conn);
                connectCable(conn);
            });
            
            showToast(`${dragGroupOffsets.length}個のパーツをコピーしました`);
            selectedModules = [];
            
            updateAllCells();
            setTimeout(renderCables, 50);
            saveActivePresetAuto();
        }

        function positionPopup(cellIndex, popupEl) {
            popupEl.style.visibility = 'hidden';
            requestAnimationFrame(() => {
                popupEl.style.transform = 'none'; 
                const cell = document.getElementById(`cell-${cellIndex}`);
                const frame = document.getElementById('phone-frame');
                if (!cell || !frame) return;
                const cellRect = cell.getBoundingClientRect();
                const frameRect = frame.getBoundingClientRect();
                
                const popupRect = popupEl.getBoundingClientRect(); 
                const cX = (cellRect.left - frameRect.left) + cellRect.width / 2;
                const cYTop = (cellRect.top - frameRect.top);
                const cYBottom = (cellRect.bottom - frameRect.top);
                
                let left = cX - popupRect.width / 2;
                const padding = 6; 
                if (left < padding) left = padding;
                if (left + popupRect.width > frameRect.width - padding) left = frameRect.width - popupRect.width - padding;
                
                let top = cYTop - popupRect.height - 12;
                if (top < padding) top = cYBottom + 12;
                if (top + popupRect.height > frameRect.height - padding) {
                    top = frameRect.height - popupRect.height - padding;
                }
                if (top < padding) top = padding;
                
                popupEl.style.left = `${left}px`;
                popupEl.style.top = `${top}px`;
                popupEl.style.visibility = 'visible';
            });
        }

        const modal = document.getElementById('shared-modal');
        const modalContent = document.getElementById('modal-content');
        const modalTitle = document.getElementById('modal-title');
        const modalHeader = document.getElementById('modal-header');
        const modalBody = document.getElementById('modal-body');

        const closeSharedModal = () => {
            modal.classList.add('hidden');
            modalContent.style.visibility = 'hidden';
            modalContent.style.transform = 'none'; 
        };
        document.getElementById('close-modal-bg').addEventListener('click', closeSharedModal);

        const MODULE_DEFAULTS = {
            VCO: () => ({ type: 'VCO', freq: 220, wave: 'sawtooth' }),
            VCF: () => ({ type: 'VCF', cutoff: 1800, q: 2.5, filterType: 'lowpass', modDepth: 1200 }),
            VCA: () => ({ type: 'VCA', level: 1.0, cvDepth: 1.0 }),
            FOLD: () => ({ type: 'FOLD', wave: 'sine', fold: 1.5, bias: 0.0, cvDepth: 1.0 }),
            ADSR: () => ({ type: 'ADSR', attack: 0.02, decay: 0.2, sustain: 0.6, release: 0.4 }),
            LFO: () => ({ type: 'LFO', waveType: 'sine', polarity: 'bipolar', rate: 2.0, depth: 1.0, duty: 0.5 }),
            DELAY: () => ({ type: 'DELAY', delayTime: 0.3, feedback: 0.4, mix: 0.5, cvDepth: 0.05 }),
            MIX: () => ({ type: 'MIX', channels: 2, lvl1: 1.0, lvl2: 1.0, lvl3: 1.0, lvl4: 1.0 }),
            SLIDER: () => ({ type: 'SLIDER', vol: 0.70 }),
            NOISE: () => ({ type: 'NOISE', noiseType: 'white', tone: 8000, level: 0.8 }),
            CLK: () => ({ type: 'CLK', bpm: masterBPM || 120, div: 'x2', pulseWidthMs: 15 }),
            TOGGLE: () => ({ type: 'TOGGLE', state: true }),

            SCOPE: () => ({ type: 'SCOPE', timeSpan: 0.01, vRange: 5.0, trigMode: 'auto' }),
            MON: () => ({ type: 'MON', channels: 1 }),
            SPEAKER: () => ({ type: 'SPEAKER', masterVol: 0.12 }),
            KEY: () => ({ type: 'KEY', octave: 4, lastNote: 'C4', currentMidi: 60 }),
            SEQ: () => ({
                type: 'SEQ',

                steps: [
                    { cv: 0.0, active: true, cvActive: true, gate: true },
                    { cv: 0.167, active: true, cvActive: true, gate: true },
                    { cv: 0.333, active: true, cvActive: true, gate: true },
                    { cv: 0.417, active: true, cvActive: true, gate: true },
                    { cv: 0.583, active: true, cvActive: true, gate: true },
                    { cv: 0.75, active: true, cvActive: true, gate: true },
                    { cv: 0.917, active: true, cvActive: true, gate: true },
                    { cv: 1.0, active: true, cvActive: true, gate: true }
                ]
            })
        };

        function openAddModal(index) {
            activePopupIndex = index;
            modalContent.className = "absolute bg-slate-900/95 border border-slate-700 rounded-lg w-auto p-1.5 shadow-2xl backdrop-blur-md";
            modalHeader.className = "border-b border-slate-800 pb-1 px-1 flex justify-between items-center";
            modalTitle.textContent = "ADD MODULE";
            modalTitle.className = "text-[9px] font-bold text-cyan-300 uppercase tracking-wider";
            
            modalBody.className = "grid grid-cols-3 gap-1.5 mt-1.5 max-h-60 overflow-y-auto";
            modalBody.innerHTML = ['VCO','VCF','VCA','FOLD','ADSR','LFO','DELAY','MIX','SLIDER','KEY','SEQ','CLK','TOGGLE','MATH','SCOPE','MON','NOISE','SPEAKER'].map(type => `
                <button data-type="${type}" class="add-btn py-1.5 px-2 bg-slate-800 hover:bg-${getModuleColor(type)}-600/30 border border-slate-700 hover:border-${getModuleColor(type)}-500 rounded text-center transition">
                    <span class="font-bold text-${getModuleColor(type)}-300 text-[10px] pointer-events-none">${type}</span>
                </button>
            `).join('');

            modalBody.querySelectorAll('.add-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    saveHistory();
                    const type = btn.dataset.type;
                    const factory = MODULE_DEFAULTS[type] || (() => ({ type }));
                    const defaultData = factory();
                    gridState[activePopupIndex] = defaultData;
                    closeSharedModal();
                    showToast(`${type} を配置しました`);
                    addModuleInstance(activePopupIndex, defaultData);
                    updateCell(activePopupIndex);
                    saveActivePresetAuto();
                });
            });

            modal.classList.remove('hidden');
            positionPopup(index, modalContent);
        }

        function createVSliderHTML(id, label, min, max, step, val, unitStr, accentColor = 'cyan') {
            const displayVal = Math.abs(val) < 10 && step < 1 ? Number(val).toFixed(2) : Math.round(val);
            return `
                <div class="flex flex-col items-center gap-1 flex-1 min-w-0">
                    <span class="text-[8px] font-bold text-slate-400 uppercase tracking-tight">${label}</span>
                    <span id="${id}-disp" class="text-[9px] text-${accentColor}-300 font-mono font-bold">${displayVal}</span>
                    <div class="h-24 flex items-center justify-center my-0.5">
                        <input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}" class="native-vslider accent-${accentColor}-500">
                    </div>
                    <span class="text-[8px] font-mono text-slate-400">${unitStr}</span>
                </div>
            `;
        }

        function openSettingsModal(index) {
            activePopupIndex = index;
            const mod = gridState[index];
            if (!mod) return;

            let widthClass = "w-[160px]";
            if (mod.type === 'CLK') {
                widthClass = "w-[195px]";
            } else if (mod.type === 'MATH') {
                widthClass = "w-[260px]";
            } else if (mod.type === 'KEY') {
                widthClass = "w-[calc(100%-12px)] max-w-[420px]";
            } else if (mod.type === 'SEQ') {
                widthClass = "w-[calc(100%-12px)] max-w-[440px]";
            }

            modalContent.className = `absolute bg-slate-900/95 border border-slate-700 rounded-xl ${widthClass} p-2 shadow-2xl backdrop-blur-md`;
            modalHeader.className = "border-b border-slate-800 pb-1.5 flex justify-between items-center";
            modalTitle.textContent = `${mod.type === 'CLK' ? 'CLOCK' : mod.type} SETTINGS`;
            modalTitle.className = "text-[9px] font-bold text-cyan-300 uppercase tracking-wider";
            modalBody.className = "space-y-2 text-xs mt-2";

            if (mod.type === 'CLK') {
                let multNum = 2;
                const rawDiv = mod.div || 'x2';
                if (typeof rawDiv === 'string' && rawDiv.startsWith('x')) {

                    if (!keyEl || !keyEl.classList.contains('piano-key')) return;
                    if (activePressedKey === keyEl) return;
                    releaseKey();

                    activePressedKey = keyEl;
                    const midi = parseInt(keyEl.dataset.midi);
                    const note = keyEl.dataset.note;

                    keyEl.classList.add('!bg-amber-400', 'ring-2', 'ring-amber-300');
                    document.getElementById('modal-key-note-disp').textContent = note;

                const releaseKey = () => {
                    if (activePressedKey) {
                        activePressedKey.classList.remove('!bg-amber-400', 'ring-2', 'ring-amber-300');

                    return el ? el.closest('.piano-key') : null;
                };

                kbContainer.addEventListener('pointerdown', (e) => {
                    e.preventDefault();
                    kbContainer.setPointerCapture(e.pointerId);
                    const target = getKeyFromPoint(e.clientX, e.clientY);
                    if (target) pressKey(target);
                });

                kbContainer.addEventListener('pointermove', (e) => {
                    e.preventDefault();
                    if (activePressedKey) {
                        const target = getKeyFromPoint(e.clientX, e.clientY);
                        if (target && target !== activePressedKey) pressKey(target);
                        else if (!target) releaseKey();
                    }
                });

                kbContainer.addEventListener('pointerup', (e) => {
                    e.preventDefault();
                    releaseKey();

            } else if (mod.type === 'SEQ') {

        const DEFAULT_GRID_STATE = [

        ];

        const DEFAULT_CONNECTIONS = [
            { "from": { "cell": 0, "port": "gate_out" }, "to": { "cell": 1, "port": "gate_in" }, "description": "CLK [GATE OUT] -> SEQ [GATE IN]" },
            { "from": { "cell": 1, "port": "cv_out" }, "to": { "cell": 2, "port": "cv_in" }, "description": "SEQ [CV OUT] -> VCO [CV IN]" },

            { "from": { "cell": 3, "port": "out" }, "to": { "cell": 9, "port": "in" }, "description": "VCF [OUT] -> VCA [AUDIO IN]" },

            { "from": { "cell": 9, "port": "out" }, "to": { "cell": 4, "port": "in" }, "description": "VCA [OUT] -> SPEAKER [AUDIO IN]" }
        ];

        let currentPresetKey = localStorage.getItem('gridsynth_active_key') || 'Default';
        let presetOrder = JSON.parse(localStorage.getItem('gridsynth_preset_order') || null) || ['Default'];
        let presets = JSON.parse(localStorage.getItem('gridsynth_presets_db') || null) || {
            'Default': {
                gridState: JSON.parse(JSON.stringify(DEFAULT_GRID_STATE)),
                connections: JSON.parse(JSON.stringify(DEFAULT_CONNECTIONS))
            }
        };

        function migratePresetConnections(conns) {
            return conns.map(c => {
                let fromPort = c.from.port;
                let toPort = c.to.port;
                if (fromPort === 'gate') fromPort = 'gate_out';
                if (fromPort === 'cv') fromPort = 'cv_out';
                if (toPort === 'gate') toPort = 'gate_in';
                if (toPort === 'clk') toPort = 'gate_in';
                if (toPort === 'cv') toPort = 'cv_in';
                return {
                    from: { cell: c.from.cell, port: fromPort },
                    to: { cell: c.to.cell, port: toPort },
                    description: c.description
                };
            });
        }

        if (presets['Default']) {
            presets['Default'].connections = JSON.parse(JSON.stringify(DEFAULT_CONNECTIONS));
        }
        Object.keys(presets).forEach(k => {
            if (presets[k] && Array.isArray(presets[k].connections)) {
                presets[k].connections = migratePresetConnections(presets[k].connections);
            }
        });

        Object.keys(presets).forEach(k => {
            if (!presetOrder.includes(k)) presetOrder.push(k);
        });
        presetOrder = presetOrder.filter(k => presets[k]);

        let activeSelectedKey = currentPresetKey;
        let fileUndoStack = [];

        function getAvailableUniqueKey(baseName) {
            let counter = 1;
            let candidate = `${baseName}_${String(counter).padStart(2, '0')}`;
            while (presets[candidate]) {
                counter++;
                candidate = `${baseName}_${String(counter).padStart(2, '0')}`;
            }
            return candidate;
        }

        function updatePresetActionButtonsState() {
            const hasPresets = presetOrder.length > 0 && activeSelectedKey && Boolean(presets[activeSelectedKey]);
            const buttons = [
                document.getElementById('preset-rename-top-btn'),
                document.getElementById('preset-dup-top-btn'),
                document.getElementById('preset-del-top-btn')
            ];
            buttons.forEach(btn => {
                if (btn) {
                    if (hasPresets) {
                        btn.classList.remove('opacity-30', 'cursor-not-allowed', 'pointer-events-none');
                        btn.removeAttribute('disabled');
                    } else {
                        btn.classList.add('opacity-30', 'cursor-not-allowed', 'pointer-events-none');
                        btn.setAttribute('disabled', 'true');
                    }
                }
            });
        }

        function saveFileStateForUndo() {
            const snapshot = {
                presets: JSON.parse(JSON.stringify(presets)),
                presetOrder: [...presetOrder],
                currentPresetKey: currentPresetKey
            };
            fileUndoStack.push(snapshot);
            if (fileUndoStack.length > 5) fileUndoStack.shift();
            updateFileUndoButtonState();
        }

        function updateFileUndoButtonState() {
            const undoBtn = document.getElementById('preset-file-undo-btn');
            if (!undoBtn) return;
            if (fileUndoStack.length > 0) {
                undoBtn.classList.remove('opacity-40', 'cursor-not-allowed');
                undoBtn.removeAttribute('disabled');
            } else {
                undoBtn.classList.add('opacity-40', 'cursor-not-allowed');
                undoBtn.setAttribute('disabled', 'true');
            }
        }

        document.getElementById('preset-file-undo-btn').addEventListener('click', () => {
            if (fileUndoStack.length === 0) return;
            const prev = fileUndoStack.pop();
            presets = prev.presets;
            presetOrder = prev.presetOrder;
            currentPresetKey = prev.currentPresetKey;
            activeSelectedKey = currentPresetKey;
            
            if (presets[currentPresetKey]) {
                gridState = JSON.parse(JSON.stringify(presets[currentPresetKey].gridState));
                connections = JSON.parse(JSON.stringify(presets[currentPresetKey].connections));
            } else {
                gridState = Array(COLS * ROWS).fill(null);
                connections = [];
            }
            document.getElementById('current-preset-name').textContent = currentPresetKey || 'None';
            savePresetsDB();
            renderPresetList();
            rebuildAudioFromState(gridState, connections);
            updateAllCells();
            setTimeout(renderCables, 50);
            updateFileUndoButtonState();
            showToast('ファイル操作を元に戻しました');
        });

        function savePresetsDB() {
            localStorage.setItem('gridsynth_presets_db', JSON.stringify(presets));
            localStorage.setItem('gridsynth_preset_order', JSON.stringify(presetOrder));
            localStorage.setItem('gridsynth_active_key', currentPresetKey);
            updatePresetActionButtonsState();
        }

        function saveActivePresetAuto() {
            if (presets[currentPresetKey]) {
                presets[currentPresetKey] = {
                    gridState: JSON.parse(JSON.stringify(gridState, (k, v) => (typeof v === 'function' ? undefined : v))),
                    connections: JSON.parse(JSON.stringify(connections))
                };
                savePresetsDB();
            }
        }

        if (presets[currentPresetKey]) {
            gridState = JSON.parse(JSON.stringify(presets[currentPresetKey].gridState));
            connections = JSON.parse(JSON.stringify(presets[currentPresetKey].connections));
        } else {
            currentPresetKey = Object.keys(presets)[0] || '';
            if (currentPresetKey && presets[currentPresetKey]) {
                gridState = JSON.parse(JSON.stringify(presets[currentPresetKey].gridState));
                connections = JSON.parse(JSON.stringify(presets[currentPresetKey].connections));

            renderPresetList();

        });
