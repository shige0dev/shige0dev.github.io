<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GRIDSYNTH MOBILE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="./css/style.css?v=70">
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center bg-gray-950 p-0 sm:p-2">
    <div id="phone-frame" class="w-full h-full sm:w-[410px] sm:h-[860px] max-w-[440px] max-h-[920px] sm:max-w-none sm:max-h-none flex flex-col bg-slate-900/90 border border-slate-800 sm:rounded-3xl shadow-2xl relative overflow-hidden bg-grid">
        <!-- Page Navigation Bar -->
        <div id="page-nav-bar" class="h-6 bg-slate-950/90 border-b border-slate-800/80 px-2 flex items-center justify-between text-[10px] shrink-0 z-20 relative">
            <div class="flex items-center z-10">
                <button id="page-nav-back-btn" class="h-5 px-1.5 bg-cyan-950 hover:bg-cyan-900 border border-cyan-500/70 text-cyan-200 rounded text-[9px] font-bold items-center gap-1 transition" style="display: none;">
                    <i data-lucide="arrow-left" class="w-3 h-3"></i>MAIN
                </button>
            </div>
            <div id="page-nav-center-title" class="absolute inset-0 flex items-center justify-center pointer-events-none">
                <div id="page-nav-label" class="font-bold text-slate-300 flex items-center pointer-events-auto">
                    <span id="page-nav-title">MAIN</span>
                </div>
            </div>
            <div class="flex items-center gap-1 z-10">
                <button id="page-nav-save-btn" class="h-5 px-1.5 bg-emerald-950/80 hover:bg-emerald-900 border border-emerald-500/70 text-emerald-300 rounded flex items-center gap-1 transition shadow-sm text-[8px] font-bold cursor-pointer" style="display: none;" title="ライブラリにストック">
                    <i data-lucide="archive" class="w-2.5 h-2.5 pointer-events-none"></i><span>STOCK</span>
                </button>
            </div>
        </div>

        <main id="canvas-container" class="flex-1 relative overflow-hidden p-2 flex flex-col items-center justify-start">
            <svg id="cable-canvas" class="absolute inset-0 w-full h-full z-10 transition-opacity duration-300" shape-rendering="geometricPrecision"></svg>
            <div id="grid-board" class="grid grid-cols-5 gap-1.5 w-full relative z-20 mt-2"></div>
        </main>

        <header class="h-12 border-t border-slate-800 bg-slate-950/90 px-2 flex items-center shrink-0 z-20 gap-1.5 overflow-x-auto">
            <div class="flex items-center gap-1.5 shrink-0">
                <button id="cable-opacity-btn" class="h-7 w-[7px] border border-slate-600 bg-slate-950 rounded-none transition flex items-center justify-center p-0 shrink-0 cursor-pointer shadow-sm overflow-hidden" title="ケーブル表示切替">
                    <div id="cable-opacity-indicator" class="w-full h-full bg-slate-300 transition-opacity duration-200"></div>
                </button>
                <button id="audio-power-btn" class="h-7 w-7 bg-slate-900 hover:bg-slate-800 text-slate-400 hover:text-slate-200 rounded-lg border border-slate-700 transition flex items-center justify-center shadow-sm shrink-0" title="AUDIO ON/OFF"><i data-lucide="power" class="w-3.5 h-3.5"></i></button>
                <button id="seq-play-btn" class="h-7 w-7 bg-slate-900 hover:bg-slate-800 text-slate-400 hover:text-slate-200 rounded-lg border border-slate-700 transition flex items-center justify-center shadow-sm shrink-0" title="PLAY"><i data-lucide="play" class="w-3.5 h-3.5"></i></button>
                <button id="seq-stop-btn" class="h-7 w-7 bg-slate-900 hover:bg-slate-800 text-slate-400 hover:text-slate-200 rounded-lg border border-slate-700 transition flex items-center justify-center shadow-sm shrink-0" title="STOP"><i data-lucide="square" class="w-3.5 h-3.5"></i></button>
                <button id="seq-reset-btn" class="h-7 w-7 bg-slate-900 hover:bg-slate-800 text-slate-400 hover:text-slate-200 rounded-lg border border-slate-700 transition flex items-center justify-center shadow-sm shrink-0" title="RESET"><i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i></button>
                <div id="master-bpm-container" class="h-7 flex items-center bg-slate-900 hover:bg-slate-800 border border-slate-700 rounded-lg px-1.5 gap-0.5 shadow-sm cursor-ns-resize touch-none select-none transition shrink-0" title="上下スライドでBPM変更">
                    <span id="master-bpm-disp" class="w-6 text-slate-200 font-mono font-bold text-[10px] text-right pointer-events-none select-none">120</span>
                    <span class="text-[8px] text-slate-500 font-bold uppercase tracking-tight pointer-events-none">BPM</span>
                </div>
            </div>
            <div class="flex items-center flex-1 min-w-0">
                <button id="preset-trigger-btn" class="w-full h-7 bg-slate-900 hover:bg-slate-800 border border-slate-700 text-slate-300 text-[10px] font-medium rounded-lg px-2 flex items-center justify-between transition truncate shadow-sm">
                    <span id="current-preset-name" class="truncate">DEMO_01</span><i data-lucide="chevron-up" class="w-3 h-3 text-slate-500 shrink-0 ml-1"></i>
                </button>
            </div>
            <div class="flex items-center shrink-0">
                <button id="undo-btn" class="h-7 w-7 bg-slate-900 text-slate-400 border border-slate-700 rounded-lg transition flex items-center justify-center opacity-40 cursor-not-allowed shadow-sm shrink-0" title="UNDO" disabled><i data-lucide="undo-2" class="w-3.5 h-3.5"></i></button>
            </div>
        </header>

        <div id="preset-manager-modal" class="absolute inset-0 hidden z-50 flex items-end justify-end pb-14 pt-8 px-2">
            <div id="close-preset-bg" class="absolute inset-0 bg-black/40 backdrop-blur-[1px] cursor-pointer"></div>
            <div class="bg-slate-900/95 border border-slate-700/80 rounded-2xl w-[370px] max-w-full p-2.5 shadow-2xl relative z-10 flex flex-col max-h-full backdrop-blur-md">
                <div id="preset-list-container" class="flex-1 overflow-y-auto pr-0.5 min-h-0 mb-2"></div>
                <div class="flex items-center justify-between pt-2 border-t border-slate-800 shrink-0">
                    <div class="flex items-center gap-1 w-full justify-between">
                        <button id="preset-new-top-btn" class="h-6 px-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-md border border-slate-700 text-[8.5px] font-bold flex items-center gap-1 shrink-0"><i data-lucide="plus" class="w-2.5 h-2.5 text-emerald-400"></i>NEW</button>
                        <button id="preset-save-top-btn" class="h-6 px-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-md border border-slate-700 text-[8.5px] font-bold flex items-center gap-1 shrink-0"><i data-lucide="save" class="w-2.5 h-2.5 text-cyan-400"></i>SAVE</button>
                        <button id="preset-saveas-top-btn" class="h-6 px-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-md border border-slate-700 text-[8.5px] font-bold flex items-center gap-1 shrink-0"><i data-lucide="file-plus" class="w-2.5 h-2.5 text-cyan-400"></i>SAVE AS</button>
                        <button id="preset-export-top-btn" class="h-6 px-1.5 bg-slate-800 hover:bg-cyan-950/80 text-cyan-300 rounded-md border border-slate-700 hover:border-cyan-500/80 text-[8.5px] font-bold flex items-center gap-1 shrink-0" title="パッチ設定をJSONテキストで出力"><i data-lucide="upload" class="w-2.5 h-2.5 text-cyan-400"></i>EXPORT</button>
                        <button id="preset-import-top-btn" class="h-6 px-1.5 bg-slate-800 hover:bg-purple-950/80 text-purple-300 rounded-md border border-slate-700 hover:border-purple-500/80 text-[8.5px] font-bold flex items-center gap-1 shrink-0" title="JSONテキストを読み込み"><i data-lucide="download" class="w-2.5 h-2.5 text-purple-400"></i>IMPORT</button>
                        <button id="preset-ai-spec-top-btn" class="h-6 px-1.5 bg-slate-800 hover:bg-amber-950/80 text-amber-300 rounded-md border border-slate-700 hover:border-amber-500/80 text-[8.5px] font-bold flex items-center gap-1 shrink-0" title="AI用パッチ生成プロンプト仕様書を表示/コピー"><i data-lucide="bot" class="w-2.5 h-2.5 text-amber-400"></i>MD</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- JSON Export / Import Modal -->
        <div id="json-io-modal" class="absolute inset-0 hidden z-[60] flex items-center justify-center p-2">
            <div id="json-io-backdrop" class="absolute inset-0 bg-black/60 backdrop-blur-[2px] cursor-pointer"></div>
            <div class="relative bg-slate-900 border border-cyan-500/70 rounded-2xl w-[calc(100%-16px)] p-3 shadow-2xl z-10 flex flex-col gap-2">
                <div class="flex items-center justify-between pb-1.5 border-b border-slate-800">
                    <div class="flex items-center gap-1.5">
                        <i id="json-io-icon" data-lucide="file-code" class="w-4 h-4 text-cyan-400"></i>
                        <h4 id="json-io-title" class="text-[11px] font-bold text-cyan-300 uppercase tracking-wider">PATCH JSON EXPORT</h4>
                    </div>
                    <button id="close-json-io-btn" class="w-6 h-6 flex items-center justify-center text-slate-400 hover:text-white bg-slate-800/80 rounded-lg transition"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
                </div>
                <div class="relative">
                    <textarea id="json-io-textarea" spellcheck="false" class="w-full h-56 bg-slate-950 border border-slate-800 focus:border-cyan-500/80 rounded-xl p-2.5 font-mono text-[9px] text-cyan-200 leading-relaxed focus:outline-none resize-none select-all"></textarea>
                </div>
                <div id="json-io-footer" class="flex items-center justify-between pt-1 border-t border-slate-800/80 gap-2">
                    <!-- Dynamic action buttons -->
                </div>
            </div>
        </div>

        <div id="custom-prompt-modal" class="absolute inset-0 hidden z-[70] flex items-center justify-center">
            <div id="prompt-backdrop" class="absolute inset-0 bg-black/60 backdrop-blur-[1px] cursor-pointer"></div>
            <div id="prompt-dialog-box" class="relative bg-slate-900 border border-purple-500/70 rounded-xl w-[220px] p-3 shadow-2xl z-10 space-y-2">
                <div class="flex items-center justify-center pb-1 border-b border-slate-800">
                    <h4 id="prompt-title" class="text-[10px] font-bold text-purple-300 uppercase tracking-wider"><span>SET VALUE</span></h4>
                </div>
                <input type="text" id="prompt-input" class="w-full bg-slate-950 border border-slate-700 rounded px-2.5 py-1.5 text-center font-mono text-sm text-cyan-300 focus:outline-none focus:border-purple-500">
            </div>
        </div>

        <div id="custom-alert-modal" class="absolute inset-0 hidden z-[75] flex items-center justify-center">
            <div id="alert-backdrop" class="absolute inset-0 bg-black/60 backdrop-blur-[1px] cursor-pointer"></div>
            <div id="alert-dialog-box" class="relative bg-slate-900 border border-amber-500/80 rounded-xl w-[270px] p-3 shadow-2xl z-10 space-y-2.5">
                <div class="flex items-center gap-1.5 pb-1.5 border-b border-slate-800">
                    <i data-lucide="alert-triangle" class="w-4 h-4 text-amber-400 shrink-0"></i>
                    <h4 id="alert-title" class="text-[10px] font-bold text-amber-300 uppercase tracking-wider">ALERT</h4>
                </div>
                <div id="alert-message" class="text-[10px] text-slate-300 leading-relaxed font-sans"></div>
                <div id="alert-details" class="max-h-28 overflow-y-auto bg-slate-950/80 border border-slate-800 rounded p-1.5 font-mono text-[9px] text-amber-200/90 space-y-0.5"></div>
                <div class="pt-1 flex justify-end">
                    <button id="alert-ok-btn" class="h-6 px-3 bg-amber-600 hover:bg-amber-500 text-white font-bold text-[9px] rounded-lg transition shadow-md shadow-amber-600/30 cursor-pointer">
                        OK
                    </button>
                </div>
            </div>
        </div>

        <div id="shared-modal" class="absolute inset-0 hidden z-50">
            <div id="close-modal-bg" class="absolute inset-0 bg-black/20 backdrop-blur-[1px] cursor-pointer"></div>
            <div id="modal-content" class="absolute bg-slate-900/95 border border-slate-700 rounded-xl p-3 shadow-2xl backdrop-blur-md transition-none">
                <div id="modal-header" class="border-b border-slate-800 pb-2 flex items-center cursor-move touch-none select-none">
                    <h3 id="modal-title" class="text-[10px] font-bold text-cyan-300 uppercase tracking-wider pointer-events-none">TITLE</h3>
                </div>
                <div id="modal-body" class="text-xs"></div>
            </div>
        </div>

        <div id="dock-modal" class="absolute inset-0 hidden z-40 pointer-events-none">
            <div id="dock-backdrop" class="absolute inset-0 bg-black/25 backdrop-blur-[1px] cursor-pointer pointer-events-auto transition-opacity duration-200"></div>
            <div id="dock-content" class="absolute bg-slate-900/95 border border-cyan-500/70 rounded-xl p-2.5 shadow-2xl backdrop-blur-md pointer-events-auto transition-none left-2 right-2 w-[calc(100%-16px)]">
                <div id="dock-header" class="border-b border-slate-800 pb-1.5 flex items-center justify-between cursor-move touch-none select-none">
                    <div class="flex items-center gap-1.5 pointer-events-none">
                        <i id="dock-icon" data-lucide="music" class="w-3.5 h-3.5 text-cyan-400"></i>
                        <h3 id="dock-title" class="text-[10px] font-bold text-cyan-300 uppercase tracking-wider">KEYBOARD</h3>
                    </div>
                    <div class="flex items-center gap-1">
                        <button id="dock-lock-btn" class="h-5 px-1.5 rounded text-[8.5px] font-bold flex items-center gap-1 border transition-colors bg-slate-800 text-slate-400 border-slate-700" title="ロック/ピン留め">
                            <i data-lucide="pin" class="w-2.5 h-2.5 pointer-events-none"></i>
                            <span id="dock-lock-label" class="pointer-events-none">LOCK</span>
                        </button>
                        <button id="dock-close-btn" class="w-5 h-5 rounded flex items-center justify-center text-slate-400 hover:text-white bg-slate-800/80 transition" title="閉じる">
                            <i data-lucide="x" class="w-3.5 h-3.5 pointer-events-none"></i>
                        </button>
                    </div>
                </div>
                <div id="dock-body" class="text-xs mt-1"></div>
            </div>
        </div>

        <div id="toast" class="absolute bottom-20 left-1/2 -translate-x-1/2 px-3.5 py-1.5 bg-slate-900/95 border border-cyan-400 text-cyan-200 rounded-full text-[11px] font-bold shadow-2xl pointer-events-none opacity-0 transition-opacity duration-200 z-[100] whitespace-nowrap ring-1 ring-cyan-500/40">Message</div>
    </div>

    <script type="module" src="./src/main.js?v=122"></script>
</body>
</html>
