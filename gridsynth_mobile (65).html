<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GRIDSYNTH MOBILE</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            user-select: none;
            background-color: #030712;
            color: #f8fafc;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            touch-action: manipulation;
            overflow: hidden;
            -webkit-text-size-adjust: none;
            text-size-adjust: none;
            -webkit-tap-highlight-color: transparent;
        }
        .bg-grid {
            background-size: 20px 20px;
            background-image: radial-gradient(circle, rgba(255,255,255,0.06) 1px, transparent 1px);
        }
        #cable-canvas {
            pointer-events: none;
            z-index: 10;
            opacity: 0.85;
        }
        #cable-canvas path {
            transition: stroke 0.2s;
        }
        .drop-highlight-valid {
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.7) !important;
            background-color: rgba(255, 255, 255, 0.2) !important;
            border-color: white !important;
            z-index: 40;
        }
        .drop-highlight-copy-valid {
            box-shadow: 0 0 15px rgba(234, 179, 8, 0.7) !important;
            background-color: rgba(234, 179, 8, 0.2) !important;
            border-color: #eab308 !important;
            z-index: 40;
        }
        .drop-highlight-invalid {
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.7) !important;
            background-color: rgba(239, 68, 68, 0.2) !important;
            border-color: #ef4444 !important;
            z-index: 40;
        }
        .selected-module {
            box-shadow: 0 0 15px rgba(217, 70, 239, 0.5) !important;
            border-color: #d946ef !important;
            border-width: 2px !important;
        }
        .sep-highlight {
            background-color: #ffffff !important;
            height: 2px !important;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.95) !important;
            border-radius: 9999px;
        }
        .native-vslider {
            writing-mode: vertical-lr;
            direction: rtl;
            appearance: slider-vertical;
            -webkit-appearance: slider-vertical;
            width: 24px;
            height: 96px;
            cursor: pointer;
            padding: 0 2px;
            touch-action: none;
            background: transparent;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center bg-gray-950 p-0 sm:p-2">

    <div id="phone-frame" class="w-full h-full sm:w-[410px] sm:h-[860px] max-w-[440px] max-h-[920px] sm:max-w-none sm:max-h-none flex flex-col bg-slate-900/90 border border-slate-800 sm:rounded-3xl shadow-2xl relative overflow-hidden bg-grid">

        <!-- Header -->
        <header class="h-12 border-b border-slate-800 bg-slate-950/80 px-2 flex items-center justify-between shrink-0 z-20 gap-1 overflow-x-auto">
            <div class="flex items-center gap-1 shrink-0">
                <button id="audio-power-btn" class="p-1.5 bg-red-950/90 text-red-400 rounded-lg border border-red-500/60 transition flex items-center justify-center shadow-sm" title="AUDIO INITIALIZING">
                    <i data-lucide="power" class="w-3.5 h-3.5"></i>
                </button>

                <div class="flex items-center bg-slate-900 border border-slate-700 rounded-lg p-0.5 gap-0.5">
                    <button id="seq-play-btn" class="p-1 rounded text-slate-400 hover:text-white transition flex items-center justify-center" title="PLAY">
                        <i data-lucide="play" class="w-3.5 h-3.5 text-cyan-400"></i>
                    </button>
                    <button id="seq-pause-btn" class="p-1 rounded text-slate-400 hover:text-white transition flex items-center justify-center" title="PAUSE">
                        <i data-lucide="pause" class="w-3.5 h-3.5 text-amber-400"></i>
                    </button>
                    <button id="seq-stop-btn" class="p-1 rounded bg-rose-950/80 text-rose-300 border border-rose-500/60 shadow-xs flex items-center justify-center" title="STOP">
                        <i data-lucide="square" class="w-3.5 h-3.5"></i>
                    </button>
                </div>

                <div class="flex items-center bg-slate-900 border border-slate-700 rounded px-1.5 py-0.5 gap-0.5">
                    <span class="text-[8px] text-slate-400 font-bold uppercase tracking-tighter">BPM</span>
                    <input type="number" id="master-bpm-input" min="40" max="260" value="120" class="w-8 bg-transparent text-cyan-400 font-mono font-bold text-[10px] focus:outline-none text-center p-0">
                </div>
            </div>

            <div class="flex items-center gap-1 flex-1 max-w-[125px]">
                <button id="preset-trigger-btn" class="w-full bg-slate-900 hover:bg-slate-800 border border-slate-700 text-slate-200 text-[10px] font-medium rounded px-2 py-1 flex items-center justify-between transition truncate shadow-sm">
                    <span id="current-preset-name" class="truncate">DEMO_01</span>
                    <i data-lucide="chevron-down" class="w-3 h-3 text-slate-400 shrink-0 ml-1"></i>
                </button>
            </div>

            <div class="flex items-center gap-1 shrink-0">
                <button id="undo-btn" class="px-2 py-1 bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-700 rounded transition text-[10px] flex items-center gap-1 opacity-40 cursor-not-allowed" disabled>
                    <i data-lucide="undo-2" class="w-3 h-3"></i>
                    <span>UNDO</span>
                </button>
            </div>
        </header>

        <!-- Main Workspace -->
        <main id="canvas-container" class="flex-1 relative overflow-hidden p-2 flex flex-col items-center justify-start">
            <svg id="cable-canvas" class="absolute inset-0 w-full h-full z-10 transition-opacity duration-300" shape-rendering="geometricPrecision"></svg>
            <div id="grid-board" class="grid grid-cols-5 gap-1.5 w-full relative z-20 mt-2"></div>
        </main>

        <footer class="h-9 border-t border-slate-800 bg-slate-950/90 px-3 flex items-center justify-between text-[9px] text-slate-400 shrink-0 z-25 whitespace-nowrap overflow-hidden">
            <span>💡 Wタップ:設定 / 長押し:選択 / 選択時タップ:削除 / ドラッグ:移動(0.9sコピー)</span>
        </footer>

        <!-- Preset Manager Modal -->
        <div id="preset-manager-modal" class="absolute inset-0 hidden z-50 flex items-start justify-center pt-2 px-3">
            <div id="close-preset-bg" class="absolute inset-0 bg-black/50 backdrop-blur-[2px] cursor-pointer"></div>
            <div class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-[360px] p-2.5 shadow-2xl relative z-10 flex flex-col max-h-[78vh]">
                <div class="flex items-center gap-1.5 pb-2 border-b border-slate-800">
                    <div class="grid grid-cols-4 gap-1.5 flex-1">
                        <button id="preset-rename-top-btn" class="h-7 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg transition flex items-center justify-center border border-slate-700">
                            <i data-lucide="pencil" class="w-3.5 h-3.5 text-cyan-400"></i>
                        </button>
                        <button id="preset-dup-top-btn" class="h-7 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg transition flex items-center justify-center border border-slate-700">
                            <i data-lucide="copy" class="w-3.5 h-3.5 text-amber-400"></i>
                        </button>
                        <button id="preset-del-top-btn" class="h-7 bg-slate-800 hover:bg-slate-700 text-red-400 rounded-lg transition flex items-center justify-center border border-slate-700">
                            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                        </button>
                        <button id="preset-file-undo-btn" class="h-7 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg transition flex items-center justify-center border border-slate-700 opacity-40 cursor-not-allowed" disabled>
                            <i data-lucide="undo-2" class="w-3.5 h-3.5 text-cyan-300"></i>
                        </button>
                    </div>
                    <div class="w-[1px] h-5 bg-slate-800 mx-0.5"></div>
                    <button id="close-preset-modal-btn" class="h-7 w-7 flex items-center justify-center text-slate-400 hover:text-white bg-slate-800/60 hover:bg-slate-800 border border-slate-700/60 rounded-lg transition shrink-0">
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </button>
                </div>
                <div id="preset-list-container" class="flex-1 overflow-y-auto pr-0.5 max-h-[44vh] mt-1"></div>
                <div class="pt-2 border-t border-slate-800 mt-1">
                    <button id="preset-new-bottom-btn" class="w-full py-1 px-3 bg-slate-800 hover:bg-slate-700 border border-dashed border-cyan-500/40 text-cyan-300 rounded-lg text-xs font-bold transition flex items-center justify-center gap-1.5 shadow-sm" style="min-height: 28px;">
                        <i data-lucide="file-plus" class="w-3.5 h-3.5"></i>
                        <span>＋ 新規作成</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Custom Prompt Modal -->
        <div id="custom-prompt-modal" class="absolute inset-0 hidden z-[70]">
            <div id="prompt-backdrop" class="absolute inset-0 bg-black/50 backdrop-blur-[1px] cursor-pointer"></div>
            <div id="prompt-dialog-box" class="absolute bg-slate-900 border border-cyan-500/70 rounded-xl w-[260px] p-2.5 shadow-2xl z-10 space-y-2 transition-none">
                <div class="flex items-center justify-between pb-1 border-b border-slate-800">
                    <h4 id="prompt-title" class="text-[10px] font-bold text-cyan-300 uppercase tracking-wider flex items-center gap-1">
                        <i data-lucide="pencil" class="w-3 h-3 text-cyan-400"></i>
                        <span>TITLE</span>
                    </h4>
                </div>
                <input type="text" id="prompt-input" class="w-full bg-slate-950 border border-slate-700 rounded px-2.5 py-1 text-xs text-white focus:outline-none focus:border-cyan-500 font-medium">
                <div class="flex justify-end gap-1.5 pt-0.5">
                    <button id="prompt-cancel-btn" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-[11px] font-medium transition">キャンセル</button>
                    <button id="prompt-ok-btn" class="px-3 py-1 bg-cyan-600 hover:bg-cyan-500 text-white rounded text-[11px] font-bold transition shadow-sm">OK</button>
                </div>
            </div>
        </div>

        <!-- Shared Module Settings/Addition Modal -->
        <div id="shared-modal" class="absolute inset-0 hidden z-50">
            <div id="close-modal-bg" class="absolute inset-0 bg-black/20 backdrop-blur-[1px] cursor-pointer"></div>
            <div id="modal-content" class="absolute bg-slate-900/95 border border-slate-700 rounded-xl p-3 shadow-2xl backdrop-blur-md transition-none">
                <div id="modal-header" class="border-b border-slate-800 pb-2 flex items-center cursor-move touch-none select-none">
                    <h3 id="modal-title" class="text-[10px] font-bold text-cyan-300 uppercase tracking-wider pointer-events-none">TITLE</h3>
                </div>
                <div id="modal-body" class="text-xs"></div>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="absolute bottom-14 left-1/2 -translate-x-1/2 px-3 py-1.5 bg-slate-800/95 border border-slate-700 rounded-full text-[11px] text-cyan-200 shadow-xl pointer-events-none opacity-0 transition-opacity duration-200 z-50 whitespace-nowrap">
        Message
    </div>

    <script>
        lucide.createIcons();

        const connKey = c => `${c.from.moduleId}:${c.from.port}->${c.to.moduleId}:${c.to.port}`;
        const isSameConn = (a, b) => connKey(a) === connKey(b);

        const UIHelpers = {
            createVSliderHTML: (id, label, min, max, step, val, unitStr, accentColor = 'cyan', isPatched = false, customDispText = null) => {
                const displayVal = customDispText !== null ? customDispText : (Math.abs(val) < 10 && step < 1 ? Number(val).toFixed(2) : Math.round(val));
                return `
                    <div class="flex flex-col items-center gap-1 flex-1 min-w-0 ${isPatched ? 'opacity-30 pointer-events-none' : ''}">
                        <span class="text-[8px] font-bold text-slate-400 uppercase tracking-tight">${label}</span>
                        <span id="${id}-disp" class="text-[9px] text-${accentColor}-300 font-mono font-bold">${displayVal}</span>
                        <div class="h-24 flex items-center justify-center my-0.5">
                            <input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}" class="native-vslider accent-${accentColor}-500" ${isPatched ? 'disabled' : ''}>
                        </div>
                        <span class="text-[8px] font-mono text-slate-400">${unitStr}</span>
                    </div>
                `;
            },
            bindSlider: (id, formatter, callback) => {
                const el = document.getElementById(id);
                if (!el) return;
                el.addEventListener('input', (e) => {
                    const val = parseFloat(e.target.value);
                    const disp = document.getElementById(`${id}-disp`);
                    if (disp) disp.textContent = formatter(val);
                    callback(val);
                });
            },
            bindButtonGroup: (selector, activeClass, inactiveClass, callback) => {
                document.querySelectorAll(selector).forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll(selector).forEach(b => b.className = `${b.className.replace(activeClass, '').replace(inactiveClass, '')} ${inactiveClass}`);
                        e.target.className = `${e.target.className.replace(inactiveClass, '')} ${activeClass}`;
                        callback(e.target.dataset.val);
                    });
                });
            },
            cvToNoteName: (cvVal) => {
                const SEMITONE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
                const totalSemis = Math.round(cvVal * 12);
                const semiIdx = ((totalSemis % 12) + 12) % 12;
                return `${SEMITONE_NAMES[semiIdx]}${1 + Math.floor(totalSemis / 12)}`;
            },
            renderSchemaModal: (mod, ctx, schema) => {
                let html = '';
                if (schema.groups) {
                    schema.groups.forEach(g => {
                        const curVal = mod[g.key];
                        html += `
                            <div class="mb-1">
                                <label class="block text-[8px] text-slate-400 mb-0.5 uppercase tracking-wider font-semibold">${g.label}</label>
                                <div class="grid grid-cols-${g.cols || g.options.length} gap-0.5">
                                    ${g.options.map(opt => {
                                        const isActive = (curVal || g.options[0].val) === opt.val;
                                        return `<button class="schema-btn-${g.key} py-0.5 rounded text-[8px] font-bold border transition-colors ${isActive ? `bg-${schema.color || 'blue'}-600 text-white border-${schema.color || 'blue'}-500` : 'bg-slate-800 text-slate-400 border-slate-700'}" data-val="${opt.val}">${opt.label}</button>`;
                                    }).join('')}
                                </div>
                            </div>`;
                    });
                }
                if (schema.sliders && schema.sliders.length > 0) {
                    html += `<div class="flex items-center justify-around py-1 bg-slate-950/60 p-1 rounded-xl border border-slate-800/80 gap-1 mt-1">`;
                    schema.sliders.forEach(s => {
                        const isPatched = s.cvPort && ctx.patched && ctx.patched.has(s.cvPort);
                        const val = isPatched ? (s.patchedVal ?? s.min) : (mod[s.key] ?? s.default);
                        const dispText = isPatched ? (s.patchedText || 'EXT') : (s.format ? s.format(val) : Math.round(val));
                        html += UIHelpers.createVSliderHTML(
                            `schema-slider-${s.key}`, s.label, s.min, s.max, s.step, val,
                            isPatched ? 'PATCHED' : (s.unit || ''), s.color || schema.color || 'cyan',
                            isPatched, dispText
                        );
                    });
                    html += `</div>`;
                }
                return html;
            },
            bindSchemaEvents: (mod, ctx, schema, onChange) => {
                if (schema.groups) {
                    schema.groups.forEach(g => {
                        const act = `bg-${schema.color || 'blue'}-600 text-white border-${schema.color || 'blue'}-500`;
                        const inact = 'bg-slate-800 text-slate-400 border-slate-700';
                        UIHelpers.bindButtonGroup(`.schema-btn-${g.key}`, act, inact, (val) => {
                            mod[g.key] = val;
                            onChange();
                        });
                    });
                }
                if (schema.sliders) {
                    schema.sliders.forEach(s => {
                        if (s.cvPort && ctx.patched && ctx.patched.has(s.cvPort)) return;
                        UIHelpers.bindSlider(`schema-slider-${s.key}`, s.format || (v => Math.round(v)), (val) => {
                            mod[s.key] = val;
                            onChange();
                        });
                    });
                }
            }
        };

        const AudioHelpers = {
            set: (param, val, ctx, timeConstant = 0.02) => {
                if (param && ctx) param.setTargetAtTime(val, ctx.currentTime, timeConstant);
            },
            cleanup: (nodesObj) => {
                if (!nodesObj) return;
                Object.values(nodesObj).forEach(n => {
                    if (n && typeof n.stop === 'function') { try { n.stop(); } catch(e){} }
                    if (n && typeof n.disconnect === 'function') { try { n.disconnect(); } catch(e){} }
                    if (Array.isArray(n)) {
                        n.forEach(item => {
                            if (item && typeof item.disconnect === 'function') { try { item.disconnect(); } catch(e){} }
                        });
                    }
                });
            },
            calcFoldCurve: (fold, bias = 0.0) => {
                const n = 1024, curve = new Float32Array(n), drive = 1.0 + fold * 3.0;
                for (let i = 0; i < n; i++) {
                    let val = (((i * 2) / n - 1) + bias) * drive;
                    for (let iter = 0; iter < 10; iter++) {
                        if (val > 1.0) val = 2.0 - val;
                        else if (val < -1.0) val = -2.0 - val;
                        else break;
                    }
                    curve[i] = Math.max(-1.0, Math.min(1.0, val * 0.85));
                }
                return curve;
            }
        };

        const MODULE_REGISTRY = {
            VCO: {
                color: 'blue',
                defaults: () => ({ type: 'VCO', freq: 220, wave: 'sawtooth' }),
                ports: () => ({ in: [{ port: 'cv_in', color: 'bg-amber-500', title: 'IN: 1V/OCT CV' }], out: [{ port: 'wave_out', color: 'bg-blue-500', title: 'OUT: AUDIO' }] }),
                schema: {
                    color: 'blue',
                    groups: [{ key: 'wave', label: 'Waveform', cols: 2, options: [{ val: 'sawtooth', label: 'SAW' }, { val: 'square', label: 'SQR' }, { val: 'sine', label: 'SIN' }, { val: 'triangle', label: 'TRI' }] }],
                    sliders: [{ key: 'freq', label: 'FREQ', min: 40, max: 2000, step: 5, default: 220, unit: 'hz', cvPort: 'cv_in', patchedVal: 32.7, patchedText: '1V/OCT', format: v => Math.round(v) + 'hz' }]
                },
                renderGrid: (mod) => {
                    const waveIcons = {
                        sawtooth: '<svg class="w-5 h-3 stroke-cyan-400 fill-none stroke-[2]" viewBox="0 0 24 14"><path d="M2 12 L12 2 L12 12 L22 2 L22 12" stroke-linecap="round" stroke-linejoin="round"/></svg>',
                        square: '<svg class="w-5 h-3 stroke-cyan-400 fill-none stroke-[2]" viewBox="0 0 24 14"><path d="M2 12 L2 2 L12 2 L12 12 L22 12 L22 2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
                        sine: '<svg class="w-5 h-3 stroke-cyan-400 fill-none stroke-[2]" viewBox="0 0 24 14"><path d="M2 7 C5 0, 7 0, 10 7 C13 14, 15 14, 18 7 C20 2, 22 2, 23 7" stroke-linecap="round"/></svg>',
                        triangle: '<svg class="w-5 h-3 stroke-cyan-400 fill-none stroke-[2]" viewBox="0 0 24 14"><path d="M2 7 L7 2 L14 12 L19 2 L23 7" stroke-linecap="round" stroke-linejoin="round"/></svg>'
                    };
                    const waveKey = (mod.wave || 'sawtooth').toLowerCase();
                    const iconSvg = waveIcons[waveKey] || waveIcons.sawtooth;
                    const freq = Math.round(mod.freq || 220);
                    return `
                        <div class="flex flex-col items-center justify-center leading-none gap-1 pointer-events-none text-cyan-400">
                            ${iconSvg}
                            <span class="text-[13px] font-mono font-bold tracking-tight"><span>${freq}</span><span class="text-[9px] ml-0.5">hz</span></span>
                        </div>`;
                },
                renderModal: (mod, ctx) => UIHelpers.renderSchemaModal(mod, ctx, MODULE_REGISTRY.VCO.schema),
                bindEvents: (mod, ctx, onChange) => UIHelpers.bindSchemaEvents(mod, ctx, MODULE_REGISTRY.VCO.schema, onChange)
            },
            VCF: {
                color: 'indigo',
                defaults: () => ({ type: 'VCF', cutoff: 1800, q: 2.5, filterType: 'lowpass', modDepth: 1200 }),
                ports: () => ({ in: [{ port: 'wave_in', color: 'bg-indigo-500', title: 'IN: AUDIO' }, { port: 'cv_in', color: 'bg-amber-500', title: 'IN: CUTOFF CV' }], out: [{ port: 'wave_out', color: 'bg-blue-500', title: 'OUT: FILTERED AUDIO' }] }),
                schema: {
                    color: 'indigo',
                    groups: [{ key: 'filterType', label: 'Mode', cols: 2, options: [{ val: 'lowpass', label: 'LP' }, { val: 'highpass', label: 'HP' }, { val: 'bandpass', label: 'BP' }, { val: 'notch', label: 'NOTCH' }] }],
                    sliders: [
                        { key: 'cutoff', label: 'CUTOFF', min: 30, max: 12000, step: 10, default: 1800, unit: 'hz', format: v => Math.round(v) + 'hz' },
                        { key: 'q', label: 'RES (Q)', min: 0.1, max: 18, step: 0.1, default: 2.5, unit: 'q', format: v => v.toFixed(1) },
                        { key: 'modDepth', label: 'CV MOD', min: 0, max: 3600, step: 50, default: 1200, unit: 'depth', color: 'amber', cvPort: 'cv_in', patchedVal: 0, patchedText: 'EXT', format: v => Math.round(v) }
                    ]
                },
                renderGrid: (mod, ctx) => {
                    const modeMap = { lowpass: 'LP', highpass: 'HP', bandpass: 'BP', notch: 'NOTCH' };
                    const cutoff = Math.round(mod.cutoff ?? 1500);
                    return `
                        <div class="flex flex-col items-center justify-center leading-none gap-0.5 pointer-events-none text-cyan-400">
                            <div class="flex items-center gap-1">
                                <span class="text-[9px] font-bold uppercase">${modeMap[mod.filterType || 'lowpass'] || 'LP'}</span>
                                ${ctx && ctx.patched && ctx.patched.has('cv_in') ? '<span class="text-[7px] font-mono font-bold">EXT</span>' : ''}
                            </div>
                            <span class="text-[13px] font-mono font-bold tracking-tight"><span>${cutoff >= 1000 ? (cutoff/1000).toFixed(1) : cutoff}</span><span class="text-[9px] ml-0.5">${cutoff >= 1000 ? 'khz' : 'hz'}</span></span>
                            <span class="text-[8px] font-mono"><span class="font-bold">Q:</span><span class="font-bold">${(mod.q ?? 2.0).toFixed(1)}</span></span>
                        </div>`;
                },
                renderModal: (mod, ctx) => UIHelpers.renderSchemaModal(mod, ctx, MODULE_REGISTRY.VCF.schema),
                bindEvents: (mod, ctx, onChange) => UIHelpers.bindSchemaEvents(mod, ctx, MODULE_REGISTRY.VCF.schema, onChange)
            },
            VCA: {
                color: 'emerald',
                defaults: () => ({ type: 'VCA', level: 1.0, cvDepth: 1.0 }),

                this.connections.forEach(c => { if (!tgtKeys.has(getConnKey(c))) this.synth.disconnect(c.from.moduleId, c.from.port, c.to.moduleId, c.to.port); });

                this.modules = prev.modules; this.connections = prev.connections;
                this.syncGridMap();
                Object.entries(this.modules).forEach(([id, m]) => this.synth.updateModule(id, m, this.getPatchState(id)));
                this.selectedModuleIds = [];
                this.closeModal(); this.updateAllCells(); this.renderCables(); this.saveActivePresetAuto();

                if (this.historyStack.length === 0) {
                    const undoBtn = document.getElementById('undo-btn');
                    if (undoBtn) { undoBtn.disabled = true; undoBtn.classList.add('opacity-40', 'cursor-not-allowed'); }
                }
                this.showToast('元に戻しました (UNDO)');
            }

            renderCell(cellIndex) {
                const cell = document.getElementById(`cell-${cellIndex}`); if (!cell) return;
                const moduleId = this.gridMap[cellIndex], mod = moduleId ? this.modules[moduleId] : null;

                cell.className = `grid-cell relative aspect-square border transition-all select-none overflow-hidden touch-none ${mod ? `border-slate-600 bg-white/10 backdrop-blur-sm shadow-md shadow-black/50 ${this.selectedModuleIds.includes(moduleId) ? 'selected-module ' : ''}` : 'border-dashed border-slate-700/50 cursor-pointer empty-cell'}`;
                if (mod) {
                    const reg = MODULE_REGISTRY[mod.type]; if (!reg) return;
                    const spec = reg.ports(mod);
                    const renderPorts = (ports) => ports.map(p => `<div class="w-2 h-2 rounded-full ${p.color} port cursor-pointer hover:scale-150 transition relative before:absolute before:inset-[-4px] before:content-['']" data-module-id="${moduleId}" data-port="${p.port}" title="${p.title || ''}"></div>`).join('');
                    cell.innerHTML = `
                        <div class="absolute top-[2px] left-[3px] right-[3px] flex justify-between items-center pointer-events-none z-20">
                            <span class="font-bold text-[8px] tracking-wider text-black select-none" style="line-height: 0.8;">${mod.type}</span>
                        </div>
                        <div class="absolute inset-0 flex flex-col items-center justify-center module-body cursor-pointer p-1 z-0 pt-3 pb-3" data-module-id="${moduleId}">
                            ${reg.renderGrid(mod, { id: moduleId, patched: this.getPatchState(moduleId) })}
                        </div>
                        <div class="absolute bottom-[2px] left-[2px] right-[2px] flex justify-between items-end pointer-events-none z-10 px-0.5">
                            <div class="flex items-center gap-1 pointer-events-auto">${renderPorts(spec.in || [])}</div>
                            <div class="flex items-center gap-1 pointer-events-auto">${renderPorts(spec.out || [])}</div>
                        </div>`;
                } else {
                    cell.innerHTML = `<div class="absolute inset-0 flex items-center justify-center font-bold text-sm text-black opacity-20 select-none pointer-events-none">${String(cellIndex).padStart(2, '0')}</div>`;
                }
            }

            updateAllCells() {
                for (let i = 0; i < this.COLS * this.ROWS; i++) this.renderCell(i);
                this.updatePortHighlight();
            }

            updatePortHighlight() {
                document.querySelectorAll('.port').forEach(p => p.classList.remove('ring-2', 'ring-yellow-400', 'ring-offset-1', 'ring-offset-slate-900', 'bg-yellow-400'));
                if (this.selectedTargetForConnection) {
                    const { moduleId, port } = this.selectedTargetForConnection;
                    document.querySelector(`[data-module-id="${moduleId}"][data-port="${port}"]`)?.classList.add('ring-2', 'ring-yellow-400', 'ring-offset-1', 'ring-offset-slate-900', 'bg-yellow-400');
                }
            }

            renderCables() {
                if (!this.cableCanvas) return;
                this.cableCanvas.innerHTML = '';
                const canvasRect = this.cableCanvas.getBoundingClientRect();
                this.connections.forEach(conn => {
                    const fromEl = document.querySelector(`[data-module-id="${conn.from.moduleId}"][data-port="${conn.from.port}"]`);
                    const toEl = document.querySelector(`[data-module-id="${conn.to.moduleId}"][data-port="${conn.to.port}"]`);
                    if (!fromEl || !toEl) return;

                    const r1 = fromEl.getBoundingClientRect(), r2 = toEl.getBoundingClientRect();
                    const x1 = r1.left + r1.width/2 - canvasRect.left, y1 = r1.top + r1.height/2 - canvasRect.top;
                    const x2 = r2.left + r2.width/2 - canvasRect.left, y2 = r2.top + r2.height/2 - canvasRect.top;

                    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    const curveY = Math.max(Math.sqrt((x2 - x1)**2 + (y2 - y1)**2) * 0.4, 15);
                    path.setAttribute('d', `M ${x1} ${y1} C ${x1} ${y1 + curveY}, ${x2} ${y2 + curveY}, ${x2} ${y2}`);
                    const isCv = (conn.to.port.includes('cv') || conn.to.port.includes('gate') || conn.from.port.includes('cv') || conn.from.port.includes('gate'));
                    path.setAttribute('stroke', isCv ? '#f59e0b' : (conn.to.port === 'trig' ? '#ec4899' : (['a','b','c'].includes(conn.to.port) ? '#c084fc' : '#38bdf8')));
                    path.setAttribute('stroke-width', '4'); path.setAttribute('fill', 'none'); path.setAttribute('stroke-linecap', 'round');
                    path.style.filter = 'drop-shadow(0px 4px 3px rgba(0,0,0,0.9))';
                    this.cableCanvas.appendChild(path);
                });
            }

            handlePortTap(moduleId, portType) {
                const cur = { moduleId, port: portType };
                if (!this.selectedTargetForConnection) {
                    this.selectedTargetForConnection = cur;
                    this.showToast(`接続先をタップしてください`);
                    this.updatePortHighlight();
                } else {
                    const first = this.selectedTargetForConnection;
                    if (first.moduleId === cur.moduleId) {
                        this.showToast('同じモジュール同士は結線不可です');
                    } else {
                        const isOut = (mId, pName) => (MODULE_REGISTRY[this.modules[mId]?.type]?.ports(this.modules[mId]).out || []).some(p => p.port === pName);
                        const isOut1 = isOut(first.moduleId, first.port), isOut2 = isOut(cur.moduleId, cur.port);
                    if (isOut1 === isOut2) {
                        this.showToast(isOut1 ? 'OUT同士は接続不可' : 'IN同士は接続不可');
                    } else {
                        const src = isOut1 ? first : cur, dst = isOut1 ? cur : first;
                        const candidate = { from: src, to: dst };
                        if (this.connections.some(c => isSameConn(c, candidate))) {
                            this.showToast('すでに接続されています');
                        } else {
                            this.saveHistory();
                            this.connections.push(candidate);
                            this.synth.connect(src.moduleId, src.port, dst.moduleId, dst.port);
                                this.synth.updateModule(src.moduleId, this.modules[src.moduleId], this.getPatchState(src.moduleId));
                                this.synth.updateModule(dst.moduleId, this.modules[dst.moduleId], this.getPatchState(dst.moduleId));
                                this.showToast('ケーブルを結線しました！');
                                this.renderCell(this.modules[src.moduleId].row * this.COLS + this.modules[src.moduleId].col);
                                this.renderCell(this.modules[dst.moduleId].row * this.COLS + this.modules[dst.moduleId].col);
                                this.renderCables(); this.saveActivePresetAuto();
                            }
                        }
                    }
                    this.selectedTargetForConnection = null; this.updatePortHighlight();
                }
            }

            closeModal() {
                document.getElementById('shared-modal')?.classList.add('hidden');
                this.activePopupModuleId = null; this.activeEmptySlotIndex = null;
            }

            openBaseModal(cellIndex, title, widthClass, renderContent) {
                const modal = document.getElementById('shared-modal'), content = document.getElementById('modal-content');
                content.className = `absolute bg-slate-900/95 border border-slate-700 rounded-xl ${widthClass} p-2 shadow-2xl backdrop-blur-md transition-none`;
                document.getElementById('modal-title').textContent = title;
                renderContent(document.getElementById('modal-body'));
                modal.classList.remove('hidden');

                content.style.visibility = 'hidden';
                requestAnimationFrame(() => {
                    content.style.transform = 'none';
                    const cell = document.getElementById(`cell-${cellIndex}`), frame = document.getElementById('phone-frame');
                    if (!cell || !frame) return;
                    const cR = cell.getBoundingClientRect(), fR = frame.getBoundingClientRect(), pR = content.getBoundingClientRect();
                    let left = Math.max(6, Math.min(fR.width - pR.width - 6, (cR.left - fR.left) + cR.width/2 - pR.width/2));
                    let top = (cR.top - fR.top) - pR.height - 12;
                    if (top < 6) top = (cR.bottom - fR.top) + 12;
                    if (top + pR.height > fR.height - 6) top = fR.height - pR.height - 6;
                    content.style.left = `${left}px`; content.style.top = `${Math.max(6, top)}px`; content.style.visibility = 'visible';
                });
            }

            openAddModal(slotIndex) {
                this.activeEmptySlotIndex = slotIndex;
                this.openBaseModal(slotIndex, 'ADD MODULE', 'w-[260px]', (body) => {
                    body.className = "grid grid-cols-5 gap-1 mt-1.5 max-h-60 overflow-y-auto";
                    body.innerHTML = Object.keys(MODULE_REGISTRY).map(type => `<button data-type="${type}" class="add-btn py-1 px-0.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 hover:border-cyan-500 rounded text-center transition"><span class="font-bold text-${MODULE_REGISTRY[type].color}-300 text-[8.5px] pointer-events-none">${type}</span></button>`).join('');
                    body.querySelectorAll('.add-btn').forEach(btn => btn.addEventListener('click', () => {
                        this.saveHistory();
                        const type = btn.dataset.type, data = MODULE_REGISTRY[type].defaults(), newId = this.generateModuleId(type);
                        data.col = this.activeEmptySlotIndex % this.COLS; data.row = Math.floor(this.activeEmptySlotIndex / this.COLS);
                        this.modules[newId] = data; this.syncGridMap();
                        this.synth.addModule(newId, type, data, this.getPatchState(newId));
                        const targetCell = this.activeEmptySlotIndex;
                        this.closeModal(); this.renderCell(targetCell);
                        this.showToast(`${type} (${newId}) を配置しました`); this.saveActivePresetAuto();
                    }));
                });
            }

            openSettingsModal(moduleId) {
                this.activePopupModuleId = moduleId;
                const mod = this.modules[moduleId]; if (!mod || !MODULE_REGISTRY[mod.type]) return;
                const isWide = ['KEY', 'SEQ', 'MATH'].includes(mod.type);
                const widthClass = isWide ? 'w-[calc(100%-12px)] max-w-[440px]' : 'w-[120px]';
                const cellIndex = mod.row * this.COLS + mod.col;
                this.openBaseModal(cellIndex, mod.type, widthClass, () => this.reRenderModal());
            }

            reRenderModal() {
                const id = this.activePopupModuleId; if (!id) return;
                const mod = this.modules[id]; if (!mod || !MODULE_REGISTRY[mod.type]) return;
                const reg = MODULE_REGISTRY[mod.type], body = document.getElementById('modal-body');
                body.className = "text-xs mt-1";
                body.innerHTML = reg.renderModal(mod, { id, patched: this.getPatchState(id) });
                reg.bindEvents(mod, {
                    id, patched: this.getPatchState(id),
                    reRenderModal: () => this.reRenderModal(),
                    removeConnectionsForPort: (p) => this.removeConnectionsForPort(p),
                    sendKeyNote: (midi, isDown) => this.synth.setKeyNote(id, midi, isDown)
                }, () => {
                    this.synth.updateModule(id, mod, this.getPatchState(id));
                    this.renderCell(mod.row * this.COLS + mod.col);
                    this.saveActivePresetAuto();
                });
            }

            bindGlobalEvents() {
                document.getElementById('undo-btn')?.addEventListener('click', () => this.undo());
                document.getElementById('close-modal-bg')?.addEventListener('click', () => this.closeModal());

                // Modal header dragging
                const modalHeader = document.getElementById('modal-header');
                const modalContent = document.getElementById('modal-content');
                const phoneFrame = document.getElementById('phone-frame');
                if (modalHeader && modalContent && phoneFrame) {
                    let isModalDragging = false;
                    let modalStartX = 0, modalStartY = 0;
                    let initialLeft = 0, initialTop = 0;

                    modalHeader.addEventListener('pointerdown', (e) => {
                        e.preventDefault();
                        isModalDragging = true;
                        modalHeader.setPointerCapture(e.pointerId);
                        modalStartX = e.clientX;
                        modalStartY = e.clientY;
                        initialLeft = parseFloat(modalContent.style.left) || modalContent.offsetLeft;
                        initialTop = parseFloat(modalContent.style.top) || modalContent.offsetTop;
                    });

                    modalHeader.addEventListener('pointermove', (e) => {
                        if (!isModalDragging) return;
                        e.preventDefault();
                        const dx = e.clientX - modalStartX;
                        const dy = e.clientY - modalStartY;
                        const frameRect = phoneFrame.getBoundingClientRect();
                        const contentRect = modalContent.getBoundingClientRect();

                        const maxLeft = frameRect.width - contentRect.width - 6;
                        const maxTop = frameRect.height - contentRect.height - 6;

                        const newLeft = Math.max(6, Math.min(maxLeft, initialLeft + dx));
                        const newTop = Math.max(6, Math.min(maxTop, initialTop + dy));

                        modalContent.style.left = `${newLeft}px`;
                        modalContent.style.top = `${newTop}px`;
                    });

                    const stopModalDrag = (e) => {
                        if (!isModalDragging) return;
                        isModalDragging = false;
                        try { modalHeader.releasePointerCapture(e.pointerId); } catch {}
                    };

                    modalHeader.addEventListener('pointerup', stopModalDrag);
                    modalHeader.addEventListener('pointercancel', stopModalDrag);
                }

                document.getElementById('audio-power-btn')?.addEventListener('click', async () => {
                    const isFirstTime = !this.synth.ctx;
                    await this.synth.init();
                    if (!isFirstTime && this.synth.ctx.state === 'running') {
                        this.synth.suspend();
                        document.getElementById('audio-power-btn').className = "p-1.5 bg-red-950/90 text-red-400 rounded-lg border border-red-500/60 transition shadow-sm";
                        this.showToast('AUDIO STOPPED');
                    } else {
                        this.synth.resume();
                        this.synth.rebuildAll(this.modules, this.connections, id => this.getPatchState(id));
                        document.getElementById('audio-power-btn').className = "p-1.5 bg-emerald-950/80 text-emerald-400 rounded-lg border border-emerald-500/60 transition shadow-sm";
                        this.showToast('AUDIO RUNNING');
                    }
                });

                document.getElementById('seq-play-btn')?.addEventListener('click', async () => {
                    const isFirstTime = !this.synth.ctx;
                    await this.synth.init();
                    if (isFirstTime || this.synth.ctx.state !== 'running') {
                        this.synth.resume();
                        this.synth.rebuildAll(this.modules, this.connections, id => this.getPatchState(id));
                        document.getElementById('audio-power-btn').className = "p-1.5 bg-emerald-950/80 text-emerald-400 rounded-lg border border-emerald-500/60 transition shadow-sm";
                    }
                    this.synth.setPlaybackState(true); this.updateTransportUI();
                });
                document.getElementById('seq-pause-btn')?.addEventListener('click', () => { this.synth.setPlaybackState(false); this.updateTransportUI(); });
                document.getElementById('seq-stop-btn')?.addEventListener('click', () => {
                    this.synth.setPlaybackState(false);
                    Object.values(this.synth.modules).forEach(m => { if (m.type === 'SEQ' && m.resetStep) m.resetStep(); });
                    this.updateTransportUI();
                    document.querySelectorAll('[data-step-bar]').forEach(el => {
                        el.classList.remove('border-cyan-300', 'bg-cyan-400/25', 'shadow-[0_0_8px_rgba(34,211,238,0.8)]', 'scale-105', 'z-10');
                        el.classList.add('border-slate-600/80');
                    });
                    document.querySelectorAll('[id^="seq-modal-led-"]').forEach(el => el.className = "w-2 h-2 rounded-full bg-slate-800 border border-slate-700 transition-all");
                });
                document.getElementById('master-bpm-input')?.addEventListener('change', e => {
                    let val = Math.max(40, Math.min(260, parseInt(e.target.value) || 120));
                    e.target.value = val; this.synth.masterBPM = val;
                    Object.entries(this.modules).forEach(([id, m]) => {
                        if (m?.type === 'CLK') {
                            m.bpm = val; this.synth.updateModule(id, m, this.getPatchState(id));
                            this.renderCell(m.row * this.COLS + m.col);
                        }
                    });
                    this.saveActivePresetAuto();
                });

                this.gridBoard.addEventListener('click', e => this.handleGridClick(e));
                this.gridBoard.addEventListener('pointerdown', e => this.handlePointerDown(e));
                window.addEventListener('pointermove', e => this.handlePointerMove(e));
                window.addEventListener('pointerup', () => this.cleanupDrag(false));
                window.addEventListener('pointercancel', () => this.cleanupDrag(true));

                document.getElementById('preset-trigger-btn')?.addEventListener('click', () => { this.activeSelectedKey = this.currentPresetKey; this.renderPresetList(); document.getElementById('preset-manager-modal').classList.remove('hidden'); });
                ['close-preset-bg', 'close-preset-modal-btn'].forEach(id => document.getElementById(id)?.addEventListener('click', () => document.getElementById('preset-manager-modal').classList.add('hidden')));

                document.getElementById('preset-new-bottom-btn')?.addEventListener('click', () => this.createNewPreset());

                document.getElementById('preset-rename-top-btn')?.addEventListener('click', async () => {
                    if (!this.activeSelectedKey || !this.presets[this.activeSelectedKey]) return this.showToast('プリセットを選択してください');
                    if (this.isDemoPreset(this.activeSelectedKey)) return this.showToast('デモプリセットの名称は変更できません');
                    const oldKey = this.activeSelectedKey;
                    const newKey = await window.openCustomPrompt('プリセット名の変更', oldKey);
                    if (newKey && newKey !== oldKey) {
                        if (this.presets[newKey]) return this.showToast('同名のプリセットが既に存在します');
                        this.saveFileStateForUndo();
                        this.presets[newKey] = this.presets[oldKey]; delete this.presets[oldKey];
                        const idx = this.presetOrder.indexOf(oldKey); if (idx !== -1) this.presetOrder[idx] = newKey;
                        if (this.currentPresetKey === oldKey) { this.currentPresetKey = newKey; document.getElementById('current-preset-name').textContent = newKey; }
                        this.activeSelectedKey = newKey; this.savePresetsDB(); this.renderPresetList();
                        this.showToast(`"${newKey}" に変更しました`);
                    }
                });

                document.getElementById('preset-dup-top-btn')?.addEventListener('click', () => {
                    this.saveActivePresetAuto();
                    if (!this.activeSelectedKey || !this.presets[this.activeSelectedKey]) return this.showToast('プリセットを選択してください');
                    const targetKey = this.activeSelectedKey, newKey = this.getAvailableUniqueKey(this.isDemoPreset(targetKey) ? `${targetKey}_COPY` : targetKey);
                    this.saveFileStateForUndo();
                    this.presets[newKey] = JSON.parse(JSON.stringify(this.presets[targetKey]));
                    const firstDemoIdx = this.presetOrder.findIndex(k => this.isDemoPreset(k));
                    this.presetOrder.splice(firstDemoIdx !== -1 ? firstDemoIdx : this.presetOrder.length, 0, newKey);
                    this.activeSelectedKey = newKey; this.savePresetsDB(); this.renderPresetList();
                    this.showToast(`"${newKey}" として複製しました`);
                });

                document.getElementById('preset-del-top-btn')?.addEventListener('click', () => {
                    if (!this.activeSelectedKey || !this.presets[this.activeSelectedKey]) return this.showToast('プリセットを選択してください');
                    if (this.isDemoPreset(this.activeSelectedKey)) return this.showToast('デモプリセットは削除できません');
                    const targetKey = this.activeSelectedKey;
                    this.saveFileStateForUndo();
                    delete this.presets[targetKey];
                    this.presetOrder = this.presetOrder.filter(k => k !== targetKey);
                    if (this.currentPresetKey === targetKey) { this.currentPresetKey = this.presetOrder[0] || 'DEMO_01'; this.loadActivePreset(); }
                    this.activeSelectedKey = this.currentPresetKey; this.savePresetsDB(); this.renderPresetList();
                    this.showToast('プリセットを削除しました');
                });

                document.getElementById('preset-file-undo-btn')?.addEventListener('click', () => {
                    if (this.fileUndoStack.length === 0) return;
                    const prev = this.fileUndoStack.pop();
                    this.presets = prev.presets; this.presetOrder = prev.presetOrder; this.currentPresetKey = prev.currentPresetKey; this.activeSelectedKey = this.currentPresetKey;
                    this.loadActivePreset(); this.savePresetsDB(); this.renderPresetList();
                    this.showToast('ファイル操作を元に戻しました');
                });
            }

            updateTransportUI() {
                const playBtn = document.getElementById('seq-play-btn'), stopBtn = document.getElementById('seq-stop-btn');
                if (!playBtn || !stopBtn) return;
                playBtn.className = "p-1 rounded text-slate-400 hover:text-white transition flex items-center justify-center";
                stopBtn.className = "p-1 rounded text-slate-400 hover:text-white transition flex items-center justify-center";
                if (this.synth.isPlaying) playBtn.className = "p-1 rounded bg-cyan-600 text-white border border-cyan-400 shadow-md shadow-cyan-500/30 flex items-center justify-center";
                else stopBtn.className = "p-1 rounded bg-rose-950/80 text-rose-300 border border-rose-500/60 shadow-xs flex items-center justify-center";
            }

            handleGridClick(e) {
                const portEl = e.target.closest('.port');
                if (portEl) {
                    if (this.portLongPressed) { this.portLongPressed = false; return; }
                    this.handlePortTap(portEl.dataset.moduleId, portEl.dataset.port);
                    return;
                }
                const bodyEl = e.target.closest('.module-body');
                if (bodyEl) {
                    const mId = bodyEl.dataset.moduleId;
                    if (this.selectedModuleIds.length > 0) {
                        if (this.selectedModuleIds.includes(mId)) {
                            this.saveHistory();
                            const toRemove = [...this.selectedModuleIds];
                            toRemove.forEach(id => {
                                const rmConns = this.connections.filter(c => c.from.moduleId===id || c.to.moduleId===id);
                                rmConns.forEach(c => this.synth.disconnect(c.from.moduleId, c.from.port, c.to.moduleId, c.to.port));
                                this.connections = this.connections.filter(c => c.from.moduleId!==id && c.to.moduleId!==id);
                                this.synth.removeModule(id); delete this.modules[id];
                            });
                            this.syncGridMap(); this.selectedModuleIds = []; this.updateAllCells(); this.renderCables(); this.saveActivePresetAuto();
                            this.showToast(`${toRemove.length}個削除しました`);
                        } else this.showToast('複数選択中は操作できません');
                        return;
                    }
                    if (this.selectedTargetForConnection) return this.showToast('結線中です');
                    if (this.movingModuleId !== null || this.isDragging) return;

                    if (this.modules[mId]?.type === 'TOGGLE') {
                        this.saveHistory();
                        this.modules[mId].state = !(this.modules[mId].state !== false);
                        this.synth.updateModule(mId, this.modules[mId], this.getPatchState(mId));
                        this.renderCell(this.modules[mId].row * this.COLS + this.modules[mId].col);
                        this.saveActivePresetAuto();
                        this.showToast(this.modules[mId].state ? 'TOGGLE: ON' : 'TOGGLE: OFF');
                        return;
                    }

                    const now = Date.now();
                    if ((now - this.lastModuleTapTime < 350) && (this.lastModuleTapId === mId)) {
                        this.lastModuleTapTime = 0; this.lastModuleTapId = null;
                        this.openSettingsModal(mId);
                    } else { this.lastModuleTapTime = now; this.lastModuleTapId = mId; }
                    return;
                }
                const emptyCell = e.target.closest('.empty-cell');
                if (emptyCell) {
                    if (this.selectedTargetForConnection) return this.showToast('結線中です');
                    if (!this.isDragging) {
                        const idx = parseInt(emptyCell.dataset.index), now = Date.now();
                        if ((now - this.lastEmptyCellTapTime < 350) && (this.lastEmptyCellTapIndex === idx)) {
                            this.lastEmptyCellTapTime = 0; this.lastEmptyCellTapIndex = null;
                            if (this.selectedModuleIds.length > 0) { this.selectedModuleIds = []; this.updateAllCells(); }
                            this.openAddModal(idx);
                        } else { this.lastEmptyCellTapTime = now; this.lastEmptyCellTapIndex = idx; }
                    }
                }
            }

            handlePointerDown(e) {
                if (e.button !== 0 && e.pointerType === 'mouse') return;
                const portEl = e.target.closest('.port');
                if (portEl) {
                    const mId = portEl.dataset.moduleId, pType = portEl.dataset.port;
                    this.startX = e.clientX; this.startY = e.clientY; this.portLongPressed = false;
                    if (this.portLongPressTimer) clearTimeout(this.portLongPressTimer);
                    this.portLongPressTimer = setTimeout(() => {
                        this.portLongPressTimer = null; this.portLongPressed = true;
                        const prevC = this.connections.length, removed = this.connections.filter(c => (c.from.moduleId===mId&&c.from.port===pType) || (c.to.moduleId===mId&&c.to.port===pType));
                        this.connections = this.connections.filter(c => !((c.from.moduleId===mId&&c.from.port===pType) || (c.to.moduleId===mId&&c.to.port===pType)));
                        if (this.connections.length < prevC) {
                            this.saveHistory();
                            removed.forEach(c => this.synth.disconnect(c.from.moduleId, c.from.port, c.to.moduleId, c.to.port));
                            if (this.selectedTargetForConnection?.moduleId===mId && this.selectedTargetForConnection?.port===pType) {
                                this.selectedTargetForConnection = null; this.updatePortHighlight();
                            }
                            this.updateAllCells(); this.renderCables(); this.saveActivePresetAuto();
                            this.showToast('端子のケーブルを切断しました');
                        }
                    }, 500);
                    return;
                }
                const bodyEl = e.target.closest('.module-body');
                if (bodyEl) {
                    const mId = bodyEl.dataset.moduleId;
                    this.startX = e.clientX; this.startY = e.clientY; this.pendingDragModuleId = mId;
                    this.longPressTimer = setTimeout(() => {
                        this.longPressTimer = null;
                        this.selectedModuleIds = this.selectedModuleIds.includes(mId) ? this.selectedModuleIds.filter(id => id !== mId) : [...this.selectedModuleIds, mId];
                        this.renderCell(this.modules[mId].row * this.COLS + this.modules[mId].col);
                    }, 400);
                }
            }

            handlePointerMove(e) {
                if (this.portLongPressTimer && (Math.abs(e.clientX - this.startX) > 10 || Math.abs(e.clientY - this.startY) > 10)) {
                    clearTimeout(this.portLongPressTimer); this.portLongPressTimer = null;
                }
                if (!this.isDragging && this.pendingDragModuleId !== null && (Math.abs(e.clientX - this.startX) > 10 || Math.abs(e.clientY - this.startY) > 10)) {
                    if (this.longPressTimer) { clearTimeout(this.longPressTimer); this.longPressTimer = null; }
                    if (!this.selectedModuleIds.includes(this.pendingDragModuleId)) this.selectedModuleIds.push(this.pendingDragModuleId);

                    this.movingModuleId = this.pendingDragModuleId; this.isDragging = true; this.dragMode = 'move'; this.pendingDragModuleId = null;
                    this.dragGhost = document.createElement('div');
                    this.dragGhost.style.cssText = 'position:fixed;pointer-events:none;z-index:9999;transform-origin:0 0;left:0;top:0;';

                    const baseMod = this.modules[this.movingModuleId], baseR = document.getElementById(`cell-${baseMod.row * this.COLS + baseMod.col}`).getBoundingClientRect();
                    this.dragGroupOffsets = [];
                    this.selectedModuleIds.forEach(id => {
                        const m = this.modules[id], cellIdx = m.row * this.COLS + m.col;
                        this.dragGroupOffsets.push({ moduleId: id, dRow: m.row - baseMod.row, dCol: m.col - baseMod.col });
                        const cl = document.getElementById(`cell-${cellIdx}`).cloneNode(true);
                        cl.classList.add('absolute', 'shadow-2xl', 'scale-105');
                        cl.classList.remove('transition-all', 'opacity-30', 'selected-module', 'relative');
                        const r = document.getElementById(`cell-${cellIdx}`).getBoundingClientRect();
                        cl.style.width = r.width+'px'; cl.style.height = r.height+'px'; cl.style.left = (r.left - baseR.left)+'px'; cl.style.top = (r.top - baseR.top)+'px';
                        this.dragGhost.appendChild(cl);
                        document.getElementById(`cell-${cellIdx}`).classList.add('opacity-30');
                    });
                    this.dragGhost.classList.add('opacity-80');
                    this.dragGhostOffsetX = this.startX - baseR.left; this.dragGhostOffsetY = this.startY - baseR.top;
                    document.body.appendChild(this.dragGhost);

                    if (this.dragModeTimer) clearTimeout(this.dragModeTimer);
                    this.dragModeTimer = setTimeout(() => {
                        if (this.isDragging) { this.dragMode = 'copy'; if (this.dropTargetIndex !== null) this.updateDropHighlight(); }
                    }, 900);
                }

                if (this.isDragging && this.dragGhost) {
                    this.dragGhost.style.transform = `translate3d(${e.clientX - this.dragGhostOffsetX}px, ${e.clientY - this.dragGhostOffsetY}px, 0)`;
                    const el = document.elementFromPoint(e.clientX, e.clientY);
                    const nTarget = el ? parseInt(el.closest('.grid-cell')?.dataset.index) : null;
                    if (this.dropTargetIndex !== nTarget) {
                        this.dropTargetIndex = !isNaN(nTarget) ? nTarget : null;
                        this.updateDropHighlight();
                    }
                }
            }

            updateDropHighlight() {
                document.querySelectorAll('[data-is-highlight="true"]').forEach(c => { c.classList.remove('drop-highlight-valid', 'drop-highlight-invalid', 'drop-highlight-copy-valid'); delete c.dataset.isHighlight; });
                if (this.dropTargetIndex === null) return;
                const tRow = Math.floor(this.dropTargetIndex / this.COLS), tCol = this.dropTargetIndex % this.COLS;
                this.dragGroupValid = true;

                for (let off of this.dragGroupOffsets) {
                    const dR = tRow + off.dRow, dC = tCol + off.dCol;
                    if (dR < 0 || dR >= this.ROWS || dC < 0 || dC >= this.COLS) { this.dragGroupValid = false; break; }
                    const occ = this.gridMap[dR * this.COLS + dC];
                    if (this.dragMode === 'copy' && occ !== null) { this.dragGroupValid = false; break; }
                    if (this.dragMode === 'move' && occ !== null && !this.selectedModuleIds.includes(occ)) { this.dragGroupValid = false; break; }
                }
                for (let off of this.dragGroupOffsets) {
                    const dR = tRow + off.dRow, dC = tCol + off.dCol;
                    if (dR >= 0 && dR < this.ROWS && dC >= 0 && dC < this.COLS) {
                        const c = document.getElementById(`cell-${dR * this.COLS + dC}`);
                        if (c) {
                            c.dataset.isHighlight = "true";
                            c.classList.add(this.dragGroupValid ? (this.dragMode === 'copy' ? 'drop-highlight-copy-valid' : 'drop-highlight-valid') : 'drop-highlight-invalid');
                        }
                    }
                }
            }

            cleanupDrag(isCancel = false) {
                if (this.portLongPressTimer) { clearTimeout(this.portLongPressTimer); this.portLongPressTimer = null; }
                if (this.longPressTimer) { clearTimeout(this.longPressTimer); this.longPressTimer = null; }
                if (this.dragModeTimer) { clearTimeout(this.dragModeTimer); this.dragModeTimer = null; }
                this.pendingDragModuleId = null;

                if (this.isDragging) {
                    this.isDragging = false;
                    if (this.dragGhost) { this.dragGhost.remove(); this.dragGhost = null; }
                    document.querySelectorAll('[data-is-highlight="true"]').forEach(c => { c.classList.remove('drop-highlight-valid', 'drop-highlight-invalid', 'drop-highlight-copy-valid'); delete c.dataset.isHighlight; });
                    this.selectedModuleIds.forEach(id => { const m = this.modules[id]; if (m) document.getElementById(`cell-${m.row * this.COLS + m.col}`)?.classList.remove('opacity-30'); });

                    if (!isCancel && this.dropTargetIndex !== null && this.dragGroupValid) {
                        this.saveHistory();
                        if (this.dragMode === 'copy') {
                            this.executeGroupCopy();
                        } else {
                            const baseMod = this.modules[this.movingModuleId];
                            if (baseMod.row * this.COLS + baseMod.col !== this.dropTargetIndex) this.executeGroupMove(); else this.historyStack.pop();
                        }
                    } else if (!isCancel && this.dropTargetIndex !== null && !this.dragGroupValid) {
                        this.showToast('配置できない場所です');
                    }
                    this.movingModuleId = null; this.dropTargetIndex = null; this.dragMode = 'move';
                }
            }

            executeGroupMove() {
                const tRow = Math.floor(this.dropTargetIndex / this.COLS), tCol = this.dropTargetIndex % this.COLS;
                this.dragGroupOffsets.forEach(off => {
                    const m = this.modules[off.moduleId];
                    m.row = tRow + off.dRow; m.col = tCol + off.dCol;
                });
                this.syncGridMap(); this.showToast(`${this.dragGroupOffsets.length}個移動しました`);
                this.selectedModuleIds = []; this.updateAllCells(); setTimeout(() => this.renderCables(), 50); this.saveActivePresetAuto();
            }

            executeGroupCopy() {
                const tRow = Math.floor(this.dropTargetIndex / this.COLS), tCol = this.dropTargetIndex % this.COLS, oldToNewMap = {};
                this.dragGroupOffsets.forEach(off => {
                    const srcMod = this.modules[off.moduleId], newId = this.generateModuleId(srcMod.type);
                    oldToNewMap[off.moduleId] = newId;
                    const copied = JSON.parse(JSON.stringify(srcMod));
                    copied.row = tRow + off.dRow; copied.col = tCol + off.dCol;
                    this.modules[newId] = copied;
                    this.synth.addModule(newId, copied.type, copied, this.getPatchState(newId));
                });
                this.syncGridMap();

                this.connections.forEach(c => {
                    if (oldToNewMap[c.from.moduleId] && oldToNewMap[c.to.moduleId]) {
                        const newConn = { from: { moduleId: oldToNewMap[c.from.moduleId], port: c.from.port }, to: { moduleId: oldToNewMap[c.to.moduleId], port: c.to.port } };
                        this.connections.push(newConn);
                        this.synth.connect(newConn.from.moduleId, newConn.from.port, newConn.to.moduleId, newConn.to.port);
                    }
                });
                this.showToast(`${this.dragGroupOffsets.length}個コピーしました`);
                this.selectedModuleIds = []; this.updateAllCells(); setTimeout(() => this.renderCables(), 50); this.saveActivePresetAuto();
            }

            loadActivePreset() {
                if (!this.presets[this.currentPresetKey]) this.currentPresetKey = Object.keys(this.presets)[0] || 'Default';
                document.getElementById('current-preset-name').textContent = this.currentPresetKey;
                const p = this.normalizePreset(this.presets[this.currentPresetKey]);
                this.modules = p.modules; this.connections = p.connections;
                this.syncGridMap();
                this.synth.rebuildAll(this.modules, this.connections, id => this.getPatchState(id));
                this.updateAllCells(); setTimeout(() => this.renderCables(), 50);
            }

            saveActivePresetAuto() {
                if (this.presets[this.currentPresetKey]) {
                    this.presets[this.currentPresetKey] = { modules: JSON.parse(JSON.stringify(this.modules)), connections: JSON.parse(JSON.stringify(this.connections)) };
                    this.savePresetsDB();
                }
            }

            savePresetsDB() {
                localStorage.setItem('gridsynth_presets_db', JSON.stringify(this.presets));
                localStorage.setItem('gridsynth_preset_order', JSON.stringify(this.presetOrder));
                localStorage.setItem('gridsynth_active_key', this.currentPresetKey);
                this.updatePresetActionButtonsState();
            }

            getAvailableUniqueKey(baseName) {
                let counter = 1, candidate = `${baseName}_${String(counter).padStart(2, '0')}`;
                while (this.presets[candidate]) { counter++; candidate = `${baseName}_${String(counter).padStart(2, '0')}`; }
                return candidate;
            }

            saveFileStateForUndo() {
                this.fileUndoStack.push({ presets: JSON.parse(JSON.stringify(this.presets)), presetOrder: [...this.presetOrder], currentPresetKey: this.currentPresetKey });
                if (this.fileUndoStack.length > 5) this.fileUndoStack.shift();
                const undoBtn = document.getElementById('preset-file-undo-btn');
                if (undoBtn) { undoBtn.classList.remove('opacity-40', 'cursor-not-allowed'); undoBtn.removeAttribute('disabled'); }
            }

            updatePresetActionButtonsState() {
                const hasSelected = this.activeSelectedKey && Boolean(this.presets[this.activeSelectedKey]), isDemo = hasSelected && this.isDemoPreset(this.activeSelectedKey);
                const setBtn = (id, enable) => {
                    const el = document.getElementById(id); if (!el) return;
                    el.classList.toggle('opacity-30', !enable); el.classList.toggle('cursor-not-allowed', !enable); el.classList.toggle('pointer-events-none', !enable);
                    enable ? el.removeAttribute('disabled') : el.setAttribute('disabled', 'true');
                };
                setBtn('preset-rename-top-btn', hasSelected && !isDemo);
                setBtn('preset-del-top-btn', hasSelected && !isDemo);
                setBtn('preset-dup-top-btn', hasSelected);
            }

            createNewPreset() {
                this.saveActivePresetAuto();
                const now = new Date(), datePrefix = `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}`;
                const newKey = this.getAvailableUniqueKey(datePrefix);
                this.saveFileStateForUndo();
                this.presets[newKey] = { modules: {}, connections: [] };
                const firstDemoIdx = this.presetOrder.findIndex(k => this.isDemoPreset(k));
                this.presetOrder.splice(firstDemoIdx !== -1 ? firstDemoIdx : this.presetOrder.length, 0, newKey);
                this.activeSelectedKey = newKey; this.savePresetsDB(); this.renderPresetList();
                this.showToast(`新規プリセット "${newKey}" を作成しました`);
            }

            createPresetItemElement(k, isDemo) {
                const isActive = (k === this.currentPresetKey), isSelected = (k === this.activeSelectedKey);
                const theme = isDemo ? 'amber' : 'cyan';
                const item = document.createElement('div');
                item.className = `preset-item ${isDemo ? 'mb-1' : 'user-preset-item'} flex items-center justify-between py-1 px-3 rounded-lg border transition select-none cursor-pointer ${
                    isSelected
                        ? `bg-${theme}-950/60 border-${theme}-500${isDemo ? '/80' : ''} text-${theme}-200 font-bold shadow-sm`
                        : (isDemo ? 'bg-slate-800/40 border-slate-700/40 text-slate-300 hover:bg-slate-800/80' : 'bg-slate-800/60 border-slate-700/60 text-slate-300 hover:bg-slate-800')
                }`;
                const rightControl = isDemo
                    ? `<span class="text-[8px] font-mono px-1 py-0.5 rounded bg-slate-950 border border-slate-700 text-slate-400 shrink-0">DEMO</span>`
                    : `<div class="preset-grip flex items-center shrink-0 p-1 text-slate-500 hover:text-slate-300 cursor-grab active:cursor-grabbing touch-none"><i data-lucide="grip-vertical" class="w-4 h-4 pointer-events-none"></i></div>`;

                item.innerHTML = `
                    <div class="flex items-center gap-2 flex-1 min-w-0 pr-1 pointer-events-none">
                        <i data-lucide="${isActive ? 'check-circle-2' : 'disc'}" class="w-3.5 h-3.5 ${isActive ? `text-${theme}-400 drop-shadow-[0_0_4px_rgba(${isDemo ? '251,191,36' : '34,211,238'},0.5)]` : 'text-slate-500'} shrink-0"></i>
                        <span class="truncate text-xs ${isActive ? `text-${theme}-200 font-semibold` : 'text-slate-300'}">${k}</span>
                    </div>
                    ${rightControl}`;

                item.addEventListener('click', (e) => {
                    if (e.target.closest('.preset-grip')) return;
                    const now = Date.now(), isDbl = (now - this.lastPresetTapTime < 350) && (this.lastPresetTapKey === k);
                    this.activeSelectedKey = k;
                    if (isDbl) {
                        this.lastPresetTapTime = 0; this.lastPresetTapKey = null; this.currentPresetKey = k;
                        this.loadActivePreset(); document.getElementById('preset-manager-modal').classList.add('hidden');
                    } else {
                        this.lastPresetTapTime = now; this.lastPresetTapKey = k; this.renderPresetList();
                    }
                });
                return item;
            }

            renderPresetList() {
                const c = document.getElementById('preset-list-container'); c.innerHTML = '';
                const userKeys = this.presetOrder.filter(k => !this.isDemoPreset(k));

                const createSep = (idx) => {
                    const sep = document.createElement('div');
                    sep.className = 'preset-separator user-sep h-[1px] bg-slate-700/60 mx-1 my-[1px] transition-all duration-100 pointer-events-none';
                    sep.dataset.sepIndex = idx;
                    return sep;
                };
                const highlightSep = (sepIdx) => c.querySelectorAll('.user-sep').forEach((s, i) => s.classList.toggle('sep-highlight', i === sepIdx));
                const clearHighlight = () => c.querySelectorAll('.user-sep').forEach(s => s.classList.remove('sep-highlight'));

                const getClosestSep = (clientY) => {
                    const items = c.querySelectorAll('.user-preset-item');
                    if (items.length === 0) return 0;
                    for (let i = 0; i < items.length; i++) {
                        const r = items[i].getBoundingClientRect();
                        if (clientY < r.top + r.height / 2) return i;
                    }
                    return items.length;
                };

                const executeReorder = (fromKey, targetIdx) => {
                    const fromIdx = userKeys.indexOf(fromKey);
                    if (fromIdx !== -1 && targetIdx !== null) {
                        this.saveFileStateForUndo();
                        userKeys.splice(fromIdx, 1);
                        userKeys.splice(fromIdx < targetIdx ? targetIdx - 1 : targetIdx, 0, fromKey);
                        this.presetOrder = [...userKeys, ...this.DEMO_KEYS];
                        this.savePresetsDB(); this.renderPresetList();
                        this.showToast('順序を並び替えました');
                    }
                };

                if (userKeys.length > 0) {
                    c.appendChild(createSep(0));
                    userKeys.forEach((k, i) => {
                        const item = this.createPresetItemElement(k, false);
                        const gripEl = item.querySelector('.preset-grip');
                        if (gripEl) {
                            let dragging = false;
                            gripEl.addEventListener('pointerdown', (e) => {
                                e.preventDefault(); e.stopPropagation(); gripEl.setPointerCapture(e.pointerId);
                                dragging = true; this.currentDraggedKey = k; item.classList.add('opacity-40');
                                this.currentHoverSepIdx = getClosestSep(e.clientY); highlightSep(this.currentHoverSepIdx);
                            });
                            gripEl.addEventListener('pointermove', (e) => {
                                if (!dragging) return; e.preventDefault();
                                this.currentHoverSepIdx = getClosestSep(e.clientY); highlightSep(this.currentHoverSepIdx);
                            });
                            const finish = (e) => {
                                if (!dragging) return; dragging = false;
                                item.classList.remove('opacity-40'); clearHighlight();
                                try { gripEl.releasePointerCapture(e.pointerId); } catch{}
                                if (this.currentHoverSepIdx !== null && this.currentDraggedKey) executeReorder(this.currentDraggedKey, this.currentHoverSepIdx);
                                this.currentDraggedKey = null; this.currentHoverSepIdx = null;
                            };
                            gripEl.addEventListener('pointerup', finish); gripEl.addEventListener('pointercancel', finish);
                        }
                        c.appendChild(item);
                        c.appendChild(createSep(i + 1));
                    });
                }

                const demoHeader = document.createElement('div');
                demoHeader.className = 'flex items-center gap-1.5 px-2 pt-2.5 pb-1 mt-1 text-[8px] font-bold text-slate-500 uppercase tracking-wider select-none';
                demoHeader.innerHTML = `<i data-lucide="lock" class="w-3 h-3 text-slate-600"></i><span>固定デモプリセット (最下段・削除不可)</span>`;
                c.appendChild(demoHeader);

                this.DEMO_KEYS.forEach(k => c.appendChild(this.createPresetItemElement(k, true)));

                lucide.createIcons({ root: c });
                this.updatePresetActionButtonsState();
            }

            uiUpdateLoop() {
                if (this.synth.audioWorkletReady || this.synth.ctx) {
                    const modalEl = this.activePopupModuleId ? document.getElementById('modal-content') : null;
                    Object.entries(this.modules).forEach(([id, mod]) => {
                        const inst = this.synth.modules[id], uiDef = MODULE_REGISTRY[mod.type];
                        if (inst?.read && uiDef?.updateLive) {
                            const cellEl = document.getElementById(`cell-${mod.row * this.COLS + mod.col}`);
                            if (cellEl) uiDef.updateLive(cellEl, inst.read(), this.synth.isPlaying, (this.activePopupModuleId === id) ? modalEl : null, mod);
                        }
                    });
                }
                requestAnimationFrame(() => this.uiUpdateLoop());
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const synthEngine = new SynthEngine();
            const uiController = new UIController(synthEngine);

            const resizeObserver = new ResizeObserver(entries => {
                const isLandscape = entries[0].contentRect.width > entries[0].contentRect.height;
                uiController.gridBoard.className = isLandscape ? "grid grid-cols-8 gap-1.5 w-full relative z-20 mt-2" : "grid grid-cols-5 gap-1.5 w-full relative z-20 mt-2";
                setTimeout(() => uiController.renderCables(), 50);
            });
            const frameEl = document.getElementById('phone-frame');
            if (frameEl) resizeObserver.observe(frameEl);

            window.openCustomPrompt = (title, initialValue) => new Promise(resolve => {
                const md = document.getElementById('custom-prompt-modal'), inp = document.getElementById('prompt-input');
                const titleEl = document.getElementById('prompt-title');
                if (titleEl) titleEl.querySelector('span').textContent = title;
                if (inp) inp.value = initialValue;
                const dialogBox = document.getElementById('prompt-dialog-box');
                if (dialogBox) { dialogBox.style.left = '10%'; dialogBox.style.top = '30%'; }
                md.classList.remove('hidden'); setTimeout(() => { inp?.focus(); inp?.select(); }, 50);
                const finish = (val) => { md.classList.add('hidden'); resolve(val); };
                document.getElementById('prompt-ok-btn').onclick = () => finish(inp ? inp.value.trim() : null);
                document.getElementById('prompt-cancel-btn').onclick = () => finish(null);
            });
        });
    </script>
</body>
</html>
